[package]
name = "llm-lib"
version = "0.2.3"
edition = "2021"
description = "Каскадний доступ до LLM: локальні тири, хмарні тири, ACP-агенти з особистою підпискою (Codex, Cursor) — Rust-аналог env-контракту @7n/llm-lib"
license = "Apache-2.0"

[dependencies]
genai = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Уже транзитивна залежність genai (той самий resolved 0.12.x) — прямий
# dependency лише додає json+multipart для справжнього Batch API
# (llm_lib::remote_batch), жодного нового постачальника в графі немає.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
# 1.x: agent-client-protocol-tokio більше не існує окремо — AcpAgent
# (спавн stdio-агента) перенесено в головний крейт.
agent-client-protocol = "1.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "io-util", "time", "test-util", "net"] }
