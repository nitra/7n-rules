[package]
name = "llm-lib"
version = "0.2.4"
edition = "2021"
description = "Каскадний доступ до LLM: локальні тири, хмарні тири, ACP-агенти з особистою підпискою (Codex, Cursor) — Rust-аналог env-контракту @7n/llm-lib"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Р9 спеки rules-v2 (feature-split): важкі залежності — лише під `agents`
# (default-фіча). `rules-core` бере `tiers` (лише serde/thiserror-клас
# залежностей) через `default-features = false`, без tokio/genai/reqwest у
# lint-адоні. `llm-lib-napi` не оголошує `default-features = false`, тож
# лишається на дефолтних фічах (`agents` увімкнена) — збирається без змін.
genai = { version = "0.4", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "io-util", "time"], optional = true }
# Уже транзитивна залежність genai (той самий resolved 0.12.x) — прямий
# dependency лише додає json+multipart для справжнього Batch API
# (llm_lib::remote_batch), жодного нового постачальника в графі немає.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"], optional = true }
# 1.x: agent-client-protocol-tokio більше не існує окремо — AcpAgent
# (спавн stdio-агента) перенесено в головний крейт.
agent-client-protocol = { version = "1.2", optional = true }
# anchored_edit (§3.7 клас 3, hash-anchored line-editing): sha256 для якорів
# рядків. У llm-lib напряму не використовувався, але в workspace-графі вже
# резолвиться на 0.11.0 (mt-core → rules-core, див. Cargo.lock) — прямий
# dependency з тим самим version req перевикористовує вже довірений
# постачальник, без другої мажорної лінії sha2 у lock-файлі.
sha2 = { version = "0.11", optional = true }
# Власний агентний цикл контуру `fix` (спека ACP-only §3.7 клас 3, §3.8 —
# спайк підтвердив кодом усі шість вимог). rig дає лише двигун циклу; самі
# гарантії (anchored_edit, write_guard, дистиляційний корпус) — наш код.
rig-core = { version = "0.41", optional = true }
rig-agent = { version = "0.41", optional = true }
# fix/runner.rs: власний `HttpClientExt`-транспорт для chain-id/step
# заголовків на кожному запиті до моделі (спайк §3.8, proof2.rs — доведений
# патерн). Усі три вже транзитивно резолвлені в Cargo.lock через
# genai/reqwest/rig-core (bytes 1.12.1, http 1.4.2, futures 0.3.32) — прямий
# dependency лише підіймає їх у extern prelude цього крейта, без нового
# постачальника в графі.
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
futures = { version = "0.3", optional = true }

[features]
default = ["agents"]
# ACP-агенти (Codex/Cursor), local/cloud one-shot (genai) і batch/remote_batch
# (reqwest) — усе, що НЕ tiers. `tiers`-модуль (env-каскад моделей,
# parse/is_local_model) лишається завжди доступним: `LlmError` у lib.rs
# посилається на `tiers::Tier`, тож сам тип має бути безумовним.
agents = ["dep:genai", "dep:tokio", "dep:reqwest", "dep:agent-client-protocol", "dep:sha2", "fix-agent"]
# Іменований шов для циклу `fix`: поки що входить у `agents` (default), бо CI
# жене `cargo test --workspace` на дефолтних фічах — під не-дефолтним прапорцем
# тести циклу мовчки не виконувались би. Винесення в окремий прапорець стане
# можливим, коли зникне napi (рішення А) і споживач зможе обирати явно.
fix-agent = ["dep:rig-core", "dep:rig-agent", "dep:tokio", "dep:bytes", "dep:http", "dep:futures"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "io-util", "time", "test-util", "net"] }
# anchored_edit: тести атомарності на диску (stale-відмова не мутує файл)
# через реальний tempdir, а не in-memory fs-заглушку.
tempfile = "3"
