[toolchain]
# Пінування Rust-каналу — рішення власника 2026-08-31 (спека
# `docs/specs/2026-08-31-plugin-contract-v5.md`, розділ 10.1, "Побічна
# знахідка: у нас немає rust-toolchain.toml"). До цього файлу репозиторій
# збирався тим toolchain-ом, що трапився на машині (зміряно 2026-08-31:
# `1.100.0-nightly (bff8e12ff, 2026-08-26)`) — непіноване, доки не
# розійдеться, той самий клас ризику, що `KNOWN_PLUGIN_RANGES` (#578).
#
# `wasm32-wasip3` не роздає precompiled `std` через rustup (зміряно:
# `rustc --print target-list` знає ціль, `rustup target list` — ні), тож
# збірка шести wasm-гостей вимагає `-Z build-std=std,panic_abort`, а це
# нестабільна фіча — доступна ЛИШЕ на nightly. Пінування стає обов'язковим,
# не бажаним: `-Z build-std` без пінованого каналу невідтворюваний за
# побудовою.
#
# Канал синхронізований із сусіднім `nitra/r-plugin`
# (`rust-toolchain.toml` того репо) НАВМИСНО — обидва проєкти будують той
# самий клас wasm32-wasip3-гостей, і той самий датований nightly вже
# перевірений там на реальній wasip3-збірці (`scripts/test-component-spike.sh`).
# Компоненти `clippy`/`rustfmt` — той самий набір, що й там (лінт/форматер
# доступні на пінованому каналі, не лише інструментальний мінімум).
channel = "nightly-2026-08-27"
components = ["clippy", "rust-src", "rustfmt"]
profile = "minimal"
