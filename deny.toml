[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "OpenSSL",
  "Zlib",
  "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = []

# uluru (маленький LRU-кеш) — транзитивна залежність gix-pack, яку
# активує feature "blocking-network-client" на `gix` у workspace mt-rust
# (mt-core git dep, Р3 спеки docs/specs/2026-07-30-rules-v2-rust-core-migration.md,
# фаза 2 B1). Точковий виняток, не розширення allow-списку репо-вайд:
# MPL-2.0 — OSI-approved, file-level copyleft, прийнятний для одного
# невеликого утилітарного крейта.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "uluru"

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
