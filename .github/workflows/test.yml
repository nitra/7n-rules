name: Test

# Повний vitest-прогін (той самий `bun run test`, що й локально). До 2026-07-29
# тестового workflow не було взагалі — дрейф пінів платформних napi-пакетів
# (git на 2.9.7 при опублікованій 2.13.2) поклав 42 тести лише локально,
# а в CI проявився тільки непрямо через Lint repo-wide.
on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32-wasip2 — ціль реального wasm-плагіна `crates/plugin-lang-js`
          # (задача N2, спека
          # `docs/specs/2026-07-31-plugin-contract-v3-wasm-component.md` §3.5.5):
          # JS-тести (`wasm-plugin-parity`/`wasm-plugin-e2e`/`wasm-plugins`,
          # `npm/scripts/lib/lint-surface/tests/`) викликають реальний
          # зібраний компонент через napi-міст, не мок.
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      # Без цього vitest падає на hard error native-loader-а (npm/scripts/lib/native.mjs):
      # без JS-fallback (Р1 спеки rules-v2-rust-core-migration) delta-lint і Stop-hook
      # хук-тести не мають чим резолвити rules-napi аддон на свіжому checkout.
      # rules-cli — parity-гейт зрізу 1 фази 8 (rules-cli-parity.test.mjs,
      # `docs/specs/2026-08-01-rules-cli-phase8-skeleton.md`): тест hard-error-ить
      # без зібраного бінаря (той самий Р1-мотив, що й у loader-а аддона).
      - name: Build rules-napi addon + rules-cli binary
        run: cargo build --release -p rules-napi -p rules-cli

      # Компенсація за прибране авто-встановлення тулів у native-концернах
      # (PR #378): концерн `k8s/kubeconform` тепер падає fail-closed, якщо тула
      # немає, а добування — окрема ЯВНА команда (мінідизайн
      # `docs/specs/2026-08-04-tools-ensure-design.md`). Крок робить дві речі:
      # ставить тул на ефемерний раннер і водночас перевіряє саму
      # команду на Linux — тобто РІВНО тим шляхом (GitHub Release, делегація в
      # `ensureToolAsync` через міст), якого стаби юніт-тестів не покривають.
      - name: Ensure external lint tools
        run: ./target/release/rules-cli tools ensure kubeconform

      # Реальний wasm-плагін lang-js (задача N2) — JS wasm-dispatch тести
      # (доккомент кроку вище) падають з чіткою помилкою на свіжому checkout
      # без цього кроку (той самий require_fixture-мотив, що в Rust-тестах).
      #
      # Раніше — голий `bash crates/plugin-lang-js/build.sh`. Тепер той самий
      # `build.sh` викликається ЗСЕРЕДИНИ `build-wasm-plugins.mjs::buildAndStage`
      # (той самий крок, що `npm-publish.yml` робить для ВСІХ п'яти first-party
      # плагінів) — але звужено фільтром до ОДНОГО lang-js: реєстрація в
      # docs/plans/2026-08-05-open-questions-register.md §2.31 показала, що
      # `npm/scripts/lib/lint-surface/tests/wasm-plugin-e2e.test.mjs`,
      # `wasm-fix-e2e.test.mjs` і `npm/scripts/lib/tests/wasm-builtin-pins.test.mjs`
      # гейтяться на `existsSync(npm/wasm-plugins/builtin-pins.json)` — артефакт,
      # який генерує лише повний `node npm/scripts/build-wasm-plugins.mjs`
      # (усі 5 плагінів), а той у test.yml НІКОЛИ не викликався: три describe-блоки
      # мовчки пропускались на кожному PR. Повний 5-плагінний прогін (lang-python/
      # lang-rust/lang-php/ci-github) сюди свідомо НЕ переїжджає — ці 3 файли
      # звіряють ЛИШЕ запис "lang-js" (усі assertion на конкретних concern-ключах
      # `style/admin_table`/`js/utils_imports` — lang-js-специфічні), тож
      # генерація пінів для решти чотирьох була б чистими зайвими секундами
      # збірки без жодного нового покриття. `main()` з build-wasm-plugins.mjs
      # приймає довільний підсписок `FIRST_PARTY_WASM_PLUGINS` першим
      # аргументом — фільтр тут не дублює реєстр, а звужує його.
      - name: Build lang-js wasm plugin (raw artifact + npm/wasm-plugins/builtin-pins.json)
        run: |
          node --input-type=module -e "
            import { main, FIRST_PARTY_WASM_PLUGINS } from './npm/scripts/build-wasm-plugins.mjs'
            main(FIRST_PARTY_WASM_PLUGINS.filter(p => p.name === 'lang-js'))
          "

      # `php/mago_lint` security-фікстури (`plugins/lang-php/rules/php/mago_lint/tests/
      # security-fixtures.test.mjs`) диспатчаться через РЕАЛЬНИЙ `plugin_lang_php.wasm`
      # (той самий Rust-гість, не JS-канон — його вже знято). Без цього кроку тест
      # (гейт якого §2.31 перевела з голого PATH-скану на `ensureToolAsync('mago')`,
      # той самий канал, що добуває mago нижче через GITHUB_TOKEN) на свіжому
      # checkout падав би на `runWasmConcern`: mago добудеться, а wasm-компонент —
      # ні. lang-php — НАЙЛЕГШИЙ з п'яти first-party гостей (доккомент
      # `crates/plugin-lang-php/Cargo.toml`: лише `wit-bindgen`, без regex/toml/serde),
      # тож окремий крок тут дешевший, ніж підмішувати його в builtin-pins-крок вище
      # (той звужений навмисно лише до lang-js, доккомент там).
      - name: Build plugin-lang-php wasm component
        run: bash crates/plugin-lang-php/build.sh

      # Знахідка §2.31 (реєстр відкритих питань) під час реанімації
      # `npm/tests/integration-repo-checks.test.mjs` (`describe.skip` знято —
      # доккомент там): `checkGa` (концерн `ga/workflows`, доккомент
      # секції) чекає РЕАЛЬНИЙ `target/wasm32-wasip2/release/plugin_ci_github.wasm`,
      # якого test.yml ще НІКОЛИ не збирав. Це не лише блокер для §2.31 —
      # той самий `plugin_ci_github.wasm` жорстко вимагає (throw на import,
      # без жодного `existsSync`-гейту з console.warn) `wasm-plugin-parity-
      # ci-github.test.mjs`, тож `Full vitest run` УЖЕ падав на main до цієї
      # зміни: "0 test" на файлі — throw на завантаженні модуля, не помилка
      # тесту (перевірено `gh run list --workflow=test.yml --branch=main` —
      # 5 останніх прогонів FAIL). Крок нижче лагодить обидва: і §2.31, і цей
      # розрив, що існував ще до цієї зміни. Дешево — `plugin-ci-github` тягне
      # лише `wit-bindgen` і Rego-рушій (жоден conftest-субпроцес, `ga/workflows`
      # ганяє Rego in-process, доккомент `crates/plugin-ci-github/Cargo.toml`);
      # спільні залежності з двома кроками build.sh вище (`wit-bindgen` і т.д.)
      # уже теплі в rust-cache цього ж прогону.
      - name: Build plugin-ci-github wasm component
        run: bash crates/plugin-ci-github/build.sh

      - name: Full vitest run
        run: bun run test
        env:
          # ensure-tool: авторизований lookup GitHub Releases (per-IP rate-limit на
          # shared-runner-ах) — без токена тести, що тягнуть conftest/opa/oxfmt/mago
          # через ensure-tool, падають на чистому runner-і (той самий канон, що в
          # lint-js.yml).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
