name: Lint Rust

on:
  push:
    branches:
      - dev
      - main
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - "**/rustfmt.toml"
      - "**/clippy.toml"

  pull_request:
    branches:
      - dev
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/rustfmt.toml"
      - "**/clippy.toml"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # wasm32-wasip2 — ціль guest-фікстури contract-test-kit
          # `crates/rules-plugin-host` (задача I2 фази 6): `cargo build`
          # для неї вже дає готовий Component Model компонент, без окремого
          # adapter-кроку (доккомент `crates/test-plugin-guest/build.sh`).
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Build contract-test-kit guest fixture
        run: bash crates/test-plugin-guest/build.sh

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace
