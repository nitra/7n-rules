name: npm-publish

on:
  push:
    paths:
      - 'npm/**'
      - 'llm-lib/**'
      - 'plugins/**'
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Native artifacts потрібні лише коли змінюється сам Rust/N-API контур.
  # JS-релізи llm-lib і npm/plugin workspace-и використовують останній сумісний
  # prebuilt addon, не витрачаючи два runner-и на повторну компіляцію binary.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      native: ${{ steps.native.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect native addon changes
        id: native
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          BASE="$BEFORE"
          if [ "$BASE" = '0000000000000000000000000000000000000000' ]; then
            if ! git rev-parse --verify --quiet HEAD^ >/dev/null; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            BASE='HEAD^'
          fi
          if git diff --quiet "$BASE" HEAD -- Cargo.toml Cargo.lock llm-lib/crates; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  # ── Збірка prebuilt napi-аддона llm-lib для платформних підпакетів ───────
  # За зразком nitra/mt npm-publish.yml (build-binaries): v1-платформи —
  # darwin-arm64 + linux-x64-gnu, дзеркало NAPI_SUFFIXES у llm-lib/lib/internal/native.mjs.
  build-native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    permissions:
      contents: read # лише checkout; артефакти йдуть через runtime-токен
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14 # native Apple Silicon
            target: aarch64-apple-darwin
            pkg: llm-lib-darwin-arm64
            napi-artifact: llm-lib-napi.darwin-arm64.node
            cdylib: libllm_lib_napi.dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg: llm-lib-linux-x64
            napi-artifact: llm-lib-napi.linux-x64-gnu.node
            cdylib: libllm_lib_napi.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false # build-only, токен не потрібен

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # napi-аддон — cdylib; .node = той самий файл під napi-конвенцією імені.
      - name: Build llm-lib napi addon
        run: cargo build --release --target ${{ matrix.target }} -p llm-lib-napi

      - name: Stage addon into platform package
        run: cp "target/${{ matrix.target }}/release/${{ matrix.cdylib }}" "llm-lib/packages/${{ matrix.pkg }}/${{ matrix.napi-artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: llm-lib/packages/${{ matrix.pkg }}/*.node
          if-no-files-found: error

  release-publish:
    needs: [changes, build-native]
    # `build-native` intentionally skips for npm/plugin-only releases.
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.build-native.result == 'success' || needs.build-native.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit-back версії + git-тег
      id-token: write # КРИТИЧНО для OIDC!

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun-deps

      - uses: actions/setup-node@v6
        with:
          node-version: '24' # includes npm@11.6.0
          registry-url: 'https://registry.npmjs.org'

      - name: Clear NODE_AUTH_TOKEN (щоб npm publish пішов через OIDC, а не порожній token)
        # setup-node з registry-url сам проставляє NODE_AUTH_TOKEN як job-env навіть без секрету;
        # це блокує trusted-publishing OIDC-обмін і призводить до помилки автентифікації на npm publish.
        run: echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Configure git identity + push auth
        # persist-credentials лишається false (ga-rule, безпека): checkout не зберігає токен.
        # Push release-коміту робимо окремим кроком нижче (лише якщо publish пройшов), тож
        # даємо job-scoped ephemeral GITHUB_TOKEN явно через remote-url заздалегідь.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Synchronize main before release
        # Інший publish-run міг уже випустити той самий workspace між event checkout
        # та цим кроком. Fast-forward бере його version/CHANGELOG, щоб наступний
        # release обрав новий semver, а не помилково вважав `npm publish` дублем успіхом.
        run: |
          git fetch origin main --tags
          git merge --ff-only origin/main

      - name: Download napi addons
        if: needs.changes.outputs.native == 'true'
        uses: actions/download-artifact@v4
        with:
          path: llm-lib/packages # → llm-lib/packages/<pkg>/llm-lib-napi.<triple>.node

      - name: Smoke-check CLI-модулів (ловить hoisting-регресії залежностей до релізу)
        if: needs.changes.outputs.native == 'true'
        # Native-залежні CLI-модулі імпортуються в smoke-check, тому artifacts мають
        # бути доступні до цього кроку. Loader бере explicit override, бо
        # downloaded artifact не є встановленим platform npm-підпакетом.
        run: N_LLM_LIB_NATIVE_ADDON="$PWD/llm-lib/packages/llm-lib-linux-x64/llm-lib-napi.linux-x64-gnu.node" node npm/scripts/smoke-check-imports.mjs

      - name: Release (bump + CHANGELOG + tag)
        id: release
        # N_RULES_RELEASE_PUSH=0: bump/CHANGELOG/тег лишаються локальними в цьому checkout,
        # доки не підтвердиться хоч один успішний publish нижче — інакше git version
        # випереджає registry на кожній невдачі (саме так CI дійшов до 14.11.1 у git при
        # 14.10.4 на npm). `run` — канонічний текст кроку (npm-module.mdc template-policy),
        # тож push вимикається через env, а не зміну команди.
        run: bunx n-rules release
        env:
          N_RULES_RELEASE_PUSH: '0'

      # `release` записує в step output лише workspaces з новою версією. Кожен
      # publish step нижче перевіряє цей список, тому npm не отримує повторних
      # викликів для пакетів, яких поточний commit не релізить.
      # Новий prebuilt addon публікуємо лише після Rust/N-API змін.
      - name: Sync platform versions to @7n/llm-lib
        if: >-
          needs.changes.outputs.native == 'true' &&
          contains(fromJSON(steps.release.outputs.workspaces), 'llm-lib')
        run: |
          VERSION=$(node -p "require('./llm-lib/package.json').version")
          echo "Publishing @7n/llm-lib platform packages at version $VERSION"
          for pkg in llm-lib-darwin-arm64 llm-lib-linux-x64; do
            V="$VERSION" node -e "const f='llm-lib/packages/'+process.argv[1]+'/package.json';const p=require('./'+f);p.version=process.env.V;require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')" "$pkg"
          done
          V="$VERSION" node -e "const f='llm-lib/package.json';const p=require('./'+f);for(const k of Object.keys(p.optionalDependencies||{}))p.optionalDependencies[k]=process.env.V;require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')"

      # Платформні підпакети — ПЕРЕД @7n/llm-lib: його optionalDependencies вже
      # вказують на ці версії, тож інсталяція свіжого @7n/llm-lib мусить знаходити
      # prebuilt-аддон у registry.
      - name: Publish @7n/llm-lib-darwin-arm64
        if: >-
          needs.changes.outputs.native == 'true' &&
          contains(fromJSON(steps.release.outputs.workspaces), 'llm-lib')
        id: publish-llm-lib-darwin-arm64
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: llm-lib/packages/llm-lib-darwin-arm64/package.json

      - name: Publish @7n/llm-lib-linux-x64
        if: >-
          needs.changes.outputs.native == 'true' &&
          contains(fromJSON(steps.release.outputs.workspaces), 'llm-lib')
        id: publish-llm-lib-linux-x64
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: llm-lib/packages/llm-lib-linux-x64/package.json

      # llm-lib публікується ПЕРШИМ серед JS-пакетів: @7n/rules залежить від @7n/llm-lib,
      # тож інсталяція свіжого @7n/rules мусить знаходити пакет у registry.
      # continue-on-error: невдача одного з пакетів не має блокувати публікацію іншого.
      - name: Publish @7n/llm-lib
        if: contains(fromJSON(steps.release.outputs.workspaces), 'llm-lib')
        id: publish-llm-lib
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: llm-lib/package.json

      - name: Publish package
        if: contains(fromJSON(steps.release.outputs.workspaces), 'npm')
        id: publish-cursor
        continue-on-error: true
        uses: JS-DevTools/npm-publish@v4.1.5
        with:
          package: npm/package.json

      # Плагіни публікуються ПІСЛЯ ядра: peerDependency спрямована на @7n/rules,
      # тож інсталяція свіжого плагіна мусить знаходити сумісне ядро в registry.
      - name: Publish @7n/rules-ci-github
        if: contains(fromJSON(steps.release.outputs.workspaces), 'plugins/ci-github')
        id: publish-ci-github
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: plugins/ci-github/package.json

      - name: Publish @7n/rules-ci-azure
        if: contains(fromJSON(steps.release.outputs.workspaces), 'plugins/ci-azure')
        id: publish-ci-azure
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: plugins/ci-azure/package.json

      - name: Publish @7n/rules-lang-python
        if: contains(fromJSON(steps.release.outputs.workspaces), 'plugins/lang-python')
        id: publish-lang-python
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: plugins/lang-python/package.json

      - name: Publish @7n/rules-lang-rust
        if: contains(fromJSON(steps.release.outputs.workspaces), 'plugins/lang-rust')
        id: publish-lang-rust
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: plugins/lang-rust/package.json

      - name: Publish @7n/rules-lang-js
        if: contains(fromJSON(steps.release.outputs.workspaces), 'plugins/lang-js')
        id: publish-lang-js
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: plugins/lang-js/package.json

      - name: Publish @7n/rules-lang-php
        if: contains(fromJSON(steps.release.outputs.workspaces), 'plugins/lang-php')
        id: publish-lang-php
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: plugins/lang-php/package.json

      # Агрегує outcome усіх publish-кроків через steps-контекст (JSON), а не переліком
      # id вручну — новий пакет (крок з id, що починається на "publish-") автоматично
      # враховується тут і в push/fail-gate нижче, без правок цієї умови.
      - name: Collect publish outcomes
        id: collect-publish-outcomes
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          node -e "
            var steps = JSON.parse(process.env.STEPS_JSON);
            var entries = Object.entries(steps).filter(function (e) { return e[0].indexOf('publish-') === 0; });
            var failed = entries.filter(function (e) { return e[1].outcome === 'failure'; }).map(function (e) { return e[0]; });
            var succeeded = entries.filter(function (e) { return e[1].outcome === 'success'; }).map(function (e) { return e[0]; });
            var successfulTags = entries.filter(function (e) { return e[1].outcome === 'success'; }).map(function (e) {
              var outputs = e[1].outputs || {};
              return outputs.name && outputs.version ? outputs.name + '@' + outputs.version : null;
            }).filter(Boolean);
            var summary = entries.map(function (e) { return e[0] + '=' + e[1].outcome; }).join(', ');
            var fs = require('node:fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'any-success=' + (succeeded.length > 0) + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'any-failure=' + (failed.length > 0) + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'successful-tags=' + JSON.stringify(successfulTags) + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'summary=' + summary + '\n');
          "

      - name: Push release-коміт + теги (лише якщо бодай один publish пройшов)
        if: steps.collect-publish-outcomes.outputs.any-success == 'true'
        run: git push --follow-tags

      - name: Create GitHub Releases
        if: steps.collect-publish-outcomes.outputs.any-success == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ steps.collect-publish-outcomes.outputs.successful-tags }}
        run: |
          while IFS= read -r tag; do
            notes="$(mktemp)"
            node npm/scripts/github-package-release.mjs "$tag" "$notes"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "GitHub Release already exists for $tag"
            else
              gh release create "$tag" --title "$tag" --notes-file "$notes"
            fi
            rm "$notes"
          done < <(node npm/scripts/github-package-release.mjs --tags "$RELEASE_TAGS")

      - name: Fail job, якщо публікація хоч одного пакета впала
        if: steps.collect-publish-outcomes.outputs.any-failure == 'true'
        run: |
          echo "::error::npm publish не пройшов — ${{ steps.collect-publish-outcomes.outputs.summary }}"
          exit 1
