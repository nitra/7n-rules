name: npm-publish

on:
  # Recovery-шлях: повторити release після виправлення workflow, коли сам
  # workflow-файл не входить до path-filter `push` нижче.
  workflow_dispatch: {}
  push:
    paths:
      - 'npm/**'
      - 'plugins/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Native artifacts потрібні лише коли змінюється сам Rust/N-API контур.
  # JS-релізи npm/plugin workspace-ів використовують останній сумісний
  # prebuilt addon, не витрачаючи два runner-и на повторну компіляцію binary.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      native: ${{ steps.native.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect native addon changes
        id: native
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          BASE="$BEFORE"
          if [ "$BASE" = '0000000000000000000000000000000000000000' ]; then
            if ! git rev-parse --verify --quiet HEAD^ >/dev/null; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            BASE='HEAD^'
          fi
          if ! git diff --quiet "$BASE" HEAD -- Cargo.toml Cargo.lock crates; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail-closed страховка (інцидент @7n/rules@1.59.0/1.59.1): скасований
          # concurrency-ом build-native інакше губиться назавжди — наступні пуші
          # вже «без Rust-змін», і головний пакет їде на npm без platform-пакетів.
          # Тому native=true також коли будь-який пін platform-пакета з
          # optionalDependencies відсутній у registry: гейт добудує й
          # опублікує втрачене на найближчому пуші.
          pins='@7n/rules-darwin-arm64 npm/package.json
          @7n/rules-linux-x64 npm/package.json
          @7n/rules-win32-x64 npm/package.json'
          missing=false
          while read -r pkg manifest; do
            ver=$(node -p "require('./$manifest').optionalDependencies?.['$pkg'] ?? ''")
            [ -z "$ver" ] && continue
            if ! npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "⚠️ $pkg@$ver відсутній у registry — вмикаю build-native"
              missing=true
            fi
          done <<< "$pins"
          if [ "$missing" = true ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  # ── Збірка prebuilt rules-napi для платформних підпакетів ──────────────────
  # За зразком nitra/mt npm-publish.yml (build-binaries): rules-napi будується
  # на darwin-arm64, linux-x64-gnu і win32-x64-msvc (рішення О, §3.4a
  # plugin-contract-v3-wasm-component.md, П3 rules-v2-rust-core-migration.md).
  # Дзеркало NAPI_SUFFIXES у npm/scripts/lib/native.mjs. Historія: до виїзду
  # llm-lib (git.7n.ai/7n/llm-lib) той самий runner збирав і llm-lib-napi —
  # звідси форма матриці.
  build-native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    permissions:
      contents: read # лише checkout; артефакти йдуть через runtime-токен
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14 # native Apple Silicon
            target: aarch64-apple-darwin
            rules-pkg: rules-darwin-arm64
            rules-napi-artifact: rules-napi.darwin-arm64.node
            rules-cdylib: librules_napi.dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rules-pkg: rules-linux-x64
            rules-napi-artifact: rules-napi.linux-x64-gnu.node
            rules-cdylib: librules_napi.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rules-pkg: rules-win32-x64
            rules-napi-artifact: rules-napi.win32-x64-msvc.node
            rules-cdylib: rules_napi.dll # Windows cdylib БЕЗ lib-префікса (MSVC-конвенція)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false # build-only, токен не потрібен

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # napi-аддон — cdylib; .node = той самий файл під napi-конвенцією імені.
      - name: Build rules-napi addon
        run: cargo build --release --target ${{ matrix.target }} -p rules-napi

      # shell: bash — на windows-latest дефолтний shell для `run` це pwsh, де
      # `cp`/шлях із прямими слешами не гарантовано поводяться так само; git-bash
      # вже стоїть на windows-runner-ах (actions/runner-images), тож `cp`
      # працює ідентично macOS/Linux без окремої гілки команди.
      - name: Stage rules-napi addon into platform package
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.rules-cdylib }}" "npm/packages/${{ matrix.rules-pkg }}/${{ matrix.rules-napi-artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rules-pkg }}
          path: npm/packages/${{ matrix.rules-pkg }}/*.node
          if-no-files-found: error

      # First-party wasm-плагіни (задача O1, рішення Н §3.4
      # plugin-contract-v3-wasm-component.md) — платформо-незалежний Component
      # Model артефакт, тож збирається лише на ubuntu-рядку матриці, не для
      # кожної платформи. `node` уже стоїть на runner-і (actions/runner-images);
      # `actions/setup-node` тут — лише для закріпленої версії (той самий '24',
      # що `release-publish` нижче), не бо node інакше відсутній.
      - uses: actions/setup-node@v6
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: '24'

      - name: Add wasm32-wasip2 target (first-party wasm-плагіни)
        if: matrix.os == 'ubuntu-latest'
        run: rustup target add wasm32-wasip2

      - name: Build first-party wasm-плагіни (npm/wasm-plugins/*.wasm + builtin-pins.json)
        if: matrix.os == 'ubuntu-latest'
        run: node npm/scripts/build-wasm-plugins.mjs

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: wasm-plugins
          path: |
            npm/wasm-plugins/*.wasm
            npm/wasm-plugins/builtin-pins.json
          if-no-files-found: error

  release-publish:
    needs: [changes, build-native]
    # `build-native` intentionally skips for npm/plugin-only releases.
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.build-native.result == 'success' || needs.build-native.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit-back версії + git-тег
      id-token: write # КРИТИЧНО для OIDC!

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun-deps

      - uses: actions/setup-node@v6
        with:
          node-version: '24' # includes npm@11.6.0
          registry-url: 'https://registry.npmjs.org'

      - name: Clear NODE_AUTH_TOKEN (щоб npm publish пішов через OIDC, а не порожній token)
        # setup-node з registry-url сам проставляє NODE_AUTH_TOKEN як job-env навіть без секрету;
        # це блокує trusted-publishing OIDC-обмін і призводить до помилки автентифікації на npm publish.
        run: echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Configure git identity + push auth
        # persist-credentials лишається false (ga-rule, безпека): checkout не зберігає токен.
        # Push release-коміту робимо окремим кроком нижче (лише якщо publish пройшов), тож
        # даємо job-scoped ephemeral GITHUB_TOKEN явно через remote-url заздалегідь.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Synchronize main before release
        # Інший publish-run міг уже випустити той самий workspace між event checkout
        # та цим кроком. Fast-forward бере його version/CHANGELOG, щоб наступний
        # release обрав новий semver, а не помилково вважав `npm publish` дублем успіхом.
        run: |
          git fetch origin main --tags
          git merge --ff-only origin/main

      - name: Download rules-napi addons
        if: needs.changes.outputs.native == 'true'
        uses: actions/download-artifact@v4
        with:
          path: npm/packages # → npm/packages/<pkg>/rules-napi.<triple>.node
          pattern: rules-*

      - name: Smoke-check CLI-модулів (ловить hoisting-регресії залежностей до релізу)
        if: needs.changes.outputs.native == 'true'
        # Native-залежні CLI-модулі імпортуються в smoke-check, тому artifacts мають
        # бути доступні до цього кроку. `@7n/llm-lib` тепер приходить із registry
        # разом зі СВОЇМИ prebuilt-аддонами (джерело виїхало в git.7n.ai/7n/llm-lib),
        # тож override N_LLM_LIB_NATIVE_ADDON більше не потрібен.
        run: node npm/scripts/smoke-check-imports.mjs

      - name: Smoke-check rules-napi аддона (контракт DTO до релізу)
        if: needs.changes.outputs.native == 'true'
        # Явний override шляху (downloaded
        # artifact — не встановлений platform npm-підпакет), мінімальний прогін
        # contractVersion() ловить розбіжність DTO rules-core ⇄ rules-napi (Р10 спеки)
        # до того, як платформні пакети підуть у публікацію.
        run: |
          N_RULES_NATIVE_ADDON="$PWD/npm/packages/rules-linux-x64/rules-napi.linux-x64-gnu.node" node -e "
            import('./npm/scripts/lib/native.mjs').then(({ EXPECTED_CONTRACT_VERSION, loadNative }) => {
              const version = loadNative().contractVersion();
              if (version !== EXPECTED_CONTRACT_VERSION) throw new Error('rules-napi contractVersion=' + version + ', очікується ' + EXPECTED_CONTRACT_VERSION);
              console.log('rules-napi smoke-check: contractVersion() === ' + EXPECTED_CONTRACT_VERSION + ' OK');
            });
          "

      - name: Release (bump + CHANGELOG + tag)
        id: release
        # N_RULES_RELEASE_PUSH=0: bump/CHANGELOG/тег лишаються локальними в цьому checkout,
        # доки не підтвердиться хоч один успішний publish нижче — інакше git version
        # випереджає registry на кожній невдачі (саме так CI дійшов до 14.11.1 у git при
        # 14.10.4 на npm). `run` — канонічний текст кроку (npm-module.mdc template-policy),
        # тож push вимикається через env, а не зміну команди.
        run: bunx n-rules release
        env:
          N_RULES_RELEASE_PUSH: '0'

      # `release` записує в step output лише workspaces з новою версією. Кожен
      # publish step нижче перевіряє цей список, тому npm не отримує повторних
      # викликів для пакетів, яких поточний commit не релізить.
      # Новий prebuilt addon публікуємо лише після Rust/N-API змін.
      # Новий prebuilt rules-napi addon публікуємо лише після Rust/N-API змін.
      # `npm/package.json` optionalDependencies містить, крім платформних
      # пакетів, і `@earendil-works/pi-*` — тож тут явно перелічені лише три
      # rules-платформні ключі (win32-x64 додано рішенням О, §3.4a
      # plugin-contract-v3-wasm-component.md), без циклу по всіх
      # optionalDependencies.
      - name: Sync platform versions to @7n/rules
        if: >-
          needs.changes.outputs.native == 'true' &&
          contains(fromJSON(steps.release.outputs.workspaces), 'npm')
        run: |
          VERSION=$(node -p "require('./npm/package.json').version")
          echo "Publishing @7n/rules platform packages at version $VERSION"
          for pkg in rules-darwin-arm64 rules-linux-x64 rules-win32-x64; do
            V="$VERSION" node -e "const f='npm/packages/'+process.argv[1]+'/package.json';const p=require('./'+f);p.version=process.env.V;require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')" "$pkg"
          done
          V="$VERSION" node -e "
            const f = 'npm/package.json';
            const p = require('./' + f);
            for (const name of ['@7n/rules-darwin-arm64', '@7n/rules-linux-x64', '@7n/rules-win32-x64']) {
              if (p.optionalDependencies?.[name]) p.optionalDependencies[name] = process.env.V;
            }
            require('fs').writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
          "

      # Платформні підпакети — ПЕРЕД @7n/rules: його optionalDependencies вже
      # вказують на ці версії, тож інсталяція свіжого @7n/rules мусить знаходити
      # prebuilt-аддон у registry.
      - name: Publish @7n/rules-darwin-arm64
        if: >-
          needs.changes.outputs.native == 'true' &&
          contains(fromJSON(steps.release.outputs.workspaces), 'npm')
        id: publish-rules-darwin-arm64
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: npm/packages/rules-darwin-arm64/package.json

      - name: Publish @7n/rules-linux-x64
        if: >-
          needs.changes.outputs.native == 'true' &&
          contains(fromJSON(steps.release.outputs.workspaces), 'npm')
        id: publish-rules-linux-x64
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: npm/packages/rules-linux-x64/package.json

      # BOOTSTRAP-НОТАТКА (перший реліз @7n/rules-win32-x64): npm trusted
      # publishing (OIDC) вимагає, щоб пакет уже існував у registry з
      # налаштованим trusted publisher — перша публікація НОВОГО імені пакета
      # через OIDC неможлива (той самий канон, що й bootstrap darwin-arm64/
      # linux-x64, зафіксований у §7 rules-v2-rust-core-migration.md). Перед
      # тим, як цей крок зможе відпрацювати в CI, потрібна одноразова ручна
      # публікація `npm publish npm/packages/rules-win32-x64` під живим
      # npm-токеном підтримувача + налаштування trusted publisher на
      # npmjs.com для GitHub Actions workflow цього репозиторію. Далі —
      # steady-state через OIDC, як і для двох інших платформ.
      - name: Publish @7n/rules-win32-x64
        if: >-
          needs.changes.outputs.native == 'true' &&
          contains(fromJSON(steps.release.outputs.workspaces), 'npm')
        id: publish-rules-win32-x64
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: npm/packages/rules-win32-x64/package.json

      # Без цього кроку
      # піни `npm/package.json` ⇄ `npm/packages/rules-*` відстають від registry
      # в git після release-коміту (ризик 7 спеки rules-v2-rust-core-migration).
      # Гейт — усі ТРИ платформи. До bootstrap-публікації (див. BOOTSTRAP-НОТАТКУ
      # вище) win32-x64 падав на КОЖНОМУ релізі, і вимога його успіху блокувала
      # синк назавжди — git-піни застрягли на 1.66.0 при registry 1.73.0; тому
      # гейт тимчасово звузили до darwin/linux. Bootstrap виконано 2026-08-01,
      # win32 іде через OIDC нарівні з рештою — і звужений гейт уже став
      # шкідливим: крок «Sync platform versions» піднімає пін win32 БЕЗУМОВНО,
      # тож при невдалій його публікації коміт приземлив би маніфест, що пінить
      # неопубліковану версію (розбір 2026-08-04).
      #
      # МЕХАНІКА РЕГЕНЕРАЦІЇ LOCK (перенесено з кроку @7n/llm-lib, який виїхав
      # разом із пакетом у git.7n.ai/7n/llm-lib — знання лишається тут, бо
      # обидва інциденти відтворювані й на rules-пінах).
      #
      # Саме `bun install`, і НЕ `bun update` — обидві його форми вже ламали
      # main:
      #   • з кореня `bun update <pkg>` для пакета, якого нема в кореневому
      #     package.json, ДОПИСУЄ його в кореневі `dependencies`; правка
      #     кореневого маніфеста не потрапляє в `git add` нижче, а отруєний
      #     lock потрапляє;
      #   • з теки воркспейса `bun update` ЗАТИРАЄ на порожній рядок піни тих
      #     optional-платформ, які не ставляться на runner-і (реліз 1.76.0:
      #     linux/win32 → ""). `bun install` маніфести не чіпає взагалі —
      #     лише зводить lock під них.
      #
      # ЧЕКАННЯ РЕПЛІКАЦІЇ ПЕРЕД install (розбір 2026-08-04): для
      # optional-залежності, яку не вдалось резолвити, bun МОВЧКИ не пише
      # резолвлений запис у lock і виходить з кодом 0 — а на наступних
      # прогонах уже не резолвить її повторно (резолв тригерить лише ЗМІНА
      # піна; `--force` теж не повертає запис). Один пропущений через лаг
      # реплікації пакет зникає з bun.lock до наступного релізу — саме так
      # `@7n/rules-win32-x64` випав із lock на релізі 1.76.0. Тому: спершу
      # дочекатись, поки registry реально віддає кожну версію, потім install,
      # і звірити lock ПЕРЕД комітом — краще не закомітити нічого, ніж
      # половину.
      - name: Commit синк платформних пінів (rules)
        if: >-
          needs.changes.outputs.native == 'true' &&
          contains(fromJSON(steps.release.outputs.workspaces), 'npm') &&
          steps.publish-rules-darwin-arm64.outcome == 'success' &&
          steps.publish-rules-linux-x64.outcome == 'success' &&
          steps.publish-rules-win32-x64.outcome == 'success'
        continue-on-error: true
        run: |
          # n-rules:allow-bun-install — свідомий виняток із ga/workflow_common:
          # composite `setup-bun-deps` робить `--frozen-lockfile`, а цей крок
          # навпаки мусить ПЕРЕгенерувати lock під щойно підняті піни
          # (повна механіка — доккомент кроку вище).
          VERSION=$(node -p "require('./npm/package.json').version")
          for pkg in rules-darwin-arm64 rules-linux-x64 rules-win32-x64; do
            n=0
            until bun pm view "@7n/$pkg@$VERSION" version >/dev/null 2>&1; do
              n=$((n + 1))
              [ "$n" -ge 12 ] && { echo "::warning::registry не віддає @7n/$pkg@$VERSION — піни лишаються незакоміченими"; exit 1; }
              echo "чекаю реплікацію @7n/$pkg@$VERSION ($n)"
              sleep 10
            done
          done
          n=0
          until bun install; do
            n=$((n + 1))
            [ "$n" -ge 5 ] && { echo "::warning::registry не віддає нові платформні версії — піни лишаються незакоміченими"; exit 1; }
            sleep 15
          done
          for pkg in rules-darwin-arm64 rules-linux-x64 rules-win32-x64; do
            grep -q "\"@7n/$pkg\": \[\"@7n/$pkg@$VERSION\"" bun.lock || {
              echo "::warning::bun.lock не резолвить @7n/$pkg@$VERSION — синк не комітиться (див. доккомент кроку)"
              exit 1
            }
          done
          git add npm/package.json npm/packages/rules-darwin-arm64/package.json npm/packages/rules-linux-x64/package.json npm/packages/rules-win32-x64/package.json bun.lock
          git commit -m "chore(release): синк пінів платформних napi-пакетів @7n/rules"

      # First-party wasm-плагіни (задача O1, рішення Н §3.4
      # plugin-contract-v3-wasm-component.md) — `npm/wasm-plugins/` не
      # комітиться (`.gitignore`), тож без цього кроку ПЕРЕД `npm publish`
      # нижче пакет пішов би без вбудованих пінів. Гейт — той самий
      # `needs.changes.outputs.native`, що й rules-napi вище (build-native вже
      # тригериться на зміни `crates/**`, окремий гейт не потрібен) + `npm`-
      # workspace дійсно в списку релізів цього прогону (`steps.release` вже
      # відпрацював на цей момент, `outputs.workspaces` доступний).
      - name: Download wasm-plugins artifact (builtin-pins.json + .wasm)
        if: >-
          needs.changes.outputs.native == 'true' &&
          contains(fromJSON(steps.release.outputs.workspaces), 'npm')
        uses: actions/download-artifact@v4
        with:
          name: wasm-plugins
          path: npm/wasm-plugins

      - name: Смок-перевірка builtin-pins.json (таблиця читається, sha256 файла збігається)
        if: >-
          needs.changes.outputs.native == 'true' &&
          contains(fromJSON(steps.release.outputs.workspaces), 'npm')
        run: |
          node -e "
            const { existsSync, readFileSync } = require('node:fs');
            const { createHash } = require('node:crypto');
            const { join } = require('node:path');
            const dir = 'npm/wasm-plugins';
            const pins = JSON.parse(readFileSync(join(dir, 'builtin-pins.json'), 'utf8'));
            const names = Object.keys(pins);
            if (names.length === 0) throw new Error('builtin-pins.json порожній');
            for (const name of names) {
              const entry = pins[name];
              const wasmPath = join(dir, entry.file);
              if (!existsSync(wasmPath)) throw new Error(name + ': файл не знайдено ' + wasmPath);
              const actual = createHash('sha256').update(readFileSync(wasmPath)).digest('hex');
              if (actual !== entry.sha256) throw new Error(name + ': sha256 не збігається (очікував ' + entry.sha256 + ', отримав ' + actual + ')');
              console.log('✓ ' + name + ': ' + entry.file + ' sha256 OK');
            }
            console.log('wasm-plugins builtin-pins smoke-check OK (' + names.length + ' плагін(и))');
          "

      - name: Publish package
        if: contains(fromJSON(steps.release.outputs.workspaces), 'npm')
        id: publish-cursor
        continue-on-error: true
        uses: JS-DevTools/npm-publish@v4.1.5
        with:
          package: npm/package.json

      # Плагіни публікуються ПІСЛЯ ядра: peerDependency спрямована на @7n/rules,
      # тож інсталяція свіжого плагіна мусить знаходити сумісне ядро в registry.
      - name: Publish @7n/rules-ci-github
        if: contains(fromJSON(steps.release.outputs.workspaces), 'plugins/ci-github')
        id: publish-ci-github
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: plugins/ci-github/package.json

      - name: Publish @7n/rules-ci-azure
        if: contains(fromJSON(steps.release.outputs.workspaces), 'plugins/ci-azure')
        id: publish-ci-azure
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: plugins/ci-azure/package.json

      - name: Publish @7n/rules-lang-python
        if: contains(fromJSON(steps.release.outputs.workspaces), 'plugins/lang-python')
        id: publish-lang-python
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: plugins/lang-python/package.json

      - name: Publish @7n/rules-lang-rust
        if: contains(fromJSON(steps.release.outputs.workspaces), 'plugins/lang-rust')
        id: publish-lang-rust
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: plugins/lang-rust/package.json

      - name: Publish @7n/rules-lang-js
        if: contains(fromJSON(steps.release.outputs.workspaces), 'plugins/lang-js')
        id: publish-lang-js
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: plugins/lang-js/package.json

      - name: Publish @7n/rules-lang-php
        if: contains(fromJSON(steps.release.outputs.workspaces), 'plugins/lang-php')
        id: publish-lang-php
        continue-on-error: true
        uses: ./.github/actions/publish-npm-package
        with:
          package-json-path: plugins/lang-php/package.json

      # Агрегує outcome усіх publish-кроків через steps-контекст (JSON), а не переліком
      # id вручну — новий пакет (крок з id, що починається на "publish-") автоматично
      # враховується тут і в push/fail-gate нижче, без правок цієї умови.
      - name: Collect publish outcomes
        id: collect-publish-outcomes
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          node -e "
            var steps = JSON.parse(process.env.STEPS_JSON);
            var entries = Object.entries(steps).filter(function (e) { return e[0].indexOf('publish-') === 0; });
            var failed = entries.filter(function (e) { return e[1].outcome === 'failure'; }).map(function (e) { return e[0]; });
            var succeeded = entries.filter(function (e) { return e[1].outcome === 'success'; }).map(function (e) { return e[0]; });
            var successfulTags = entries.filter(function (e) { return e[1].outcome === 'success'; }).map(function (e) {
              var outputs = e[1].outputs || {};
              return outputs.name && outputs.version ? outputs.name + '@' + outputs.version : null;
            }).filter(Boolean);
            var summary = entries.map(function (e) { return e[0] + '=' + e[1].outcome; }).join(', ');
            var fs = require('node:fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'any-success=' + (succeeded.length > 0) + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'any-failure=' + (failed.length > 0) + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'successful-tags=' + JSON.stringify(successfulTags) + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'summary=' + summary + '\n');
          "

      - name: Push release-коміт + теги (лише якщо бодай один publish пройшов)
        if: steps.collect-publish-outcomes.outputs.any-success == 'true'
        run: git push --follow-tags

      - name: Create GitHub Releases
        if: steps.collect-publish-outcomes.outputs.any-success == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ steps.collect-publish-outcomes.outputs.successful-tags }}
        run: |
          while IFS= read -r tag; do
            notes="$(mktemp)"
            node npm/scripts/github-package-release.mjs "$tag" "$notes"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "GitHub Release already exists for $tag"
            else
              gh release create "$tag" --title "$tag" --notes-file "$notes"
            fi
            rm "$notes"
          done < <(node npm/scripts/github-package-release.mjs --tags "$RELEASE_TAGS")

      - name: Fail job, якщо публікація хоч одного пакета впала
        if: steps.collect-publish-outcomes.outputs.any-failure == 'true'
        run: |
          echo "::error::npm publish не пройшов — ${{ steps.collect-publish-outcomes.outputs.summary }}"
          exit 1
