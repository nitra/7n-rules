# Маніфест wasm-плагіна `lang-js/wasm-concerns` (задачі N2, Q1 батч 1, Q2
# батч 2, Q3, Q4 батч 4 та storybook-батч 5 — де-скоуп до byte-exact-парних
# концернів, спека
# `docs/specs/2026-07-31-plugin-contract-v3-wasm-component.md` §3.5.5 і
# `docs/specs/2026-08-01-wasm-ast-strategy.md`) —
# статичний дублікат того, що `describe()` (src/lib.rs) повертає в рантаймі.
# Поля 1:1 відповідають `rules_contract::manifest::Manifest`
# (crates/rules-contract/src/manifest.rs, без serde-перейменувань — назви
# полів тотожні Rust-структурі). Хост читає цей файл лише як довідку для
# людини й дистрибуційний supplement — джерело правди в рантаймі завжди
# `describe()` (не парситься назад у `PluginHost`, спека §3.1).
#
# TODO(v3-wasm-first-party-pins): це dev-форма піна (`{ name, path }` у
# секції `wasmPlugins` .n-rules.json споживача) — `url` + `sha256`
# дистрибуція (спека §3.4, рішення Ж) — наступний крок, поза обсягом задачі N2.

id = "lang-js/wasm-concerns"
version = "0.1.0"
world_version = "4.0.0"
domains = ["lint"]
# ТИМЧАСОВО порожньо: мажор `5.0.0` (§2.109 реєстру відкритих питань) додав
# поле `worlds`, реальна міграція шести гостей на декларації `caps`/
# `surfaces` — крок 4 спеки `docs/specs/2026-08-31-plugin-contract-v5.md`
# §12, окрема задача. До неї гість однаково НЕ інстанціюється на
# `5.x`-хості (`check_world_version` major-only).
worlds = []
# Top-level поля маніфеста — ОБОВʼЯЗКОВО перед першим `[[concerns]]`: після
# array-of-tables заголовка TOML відніс би їх до останнього елемента масиву,
# а не до кореня (як і `[capabilities]` нижче, який лишається коректним, бо
# це власна таблиця).
ci_artifacts = []
# Зріз 5 контракту v3.1 — перша реальна tool-декларація first-party плагіна;
# зріз 6 добив набір до двох із трьох схем рішення В (спека
# `2026-08-01-plugin-contract-v31-surfaces.md`). `path:` означає «резолвити
# по PATH» (`bun` — `bun/licensee`, справжня `bun`-підкоманда без npm-пакета),
# `npm:` — «`<cwd>/node_modules/.bin/<name>`, фолбек PATH» (`stylelint` —
# `style/lint`; `eslint`/`oxlint` — `js/eslint`; `jscpd` —
# `js/jscpd_duplicates`); дефолтна `pinned:` (github-реліз) чекає на
# `js-run/runtime` зрізу 7. Усі три споживаються через `exec-tool`.
# §2.86 додала `path:tee` — перший тул, чий споживач фіксер, а не детектор:
# `js/eslint` кладе ним механічно виправлений вміст на диск ДО спавну
# лінтерів (секція «§2.86» у `src/lib.rs`).
# §2.100 замінила `path:bunx` (спільний для `js/eslint` і
# `js/jscpd_duplicates`) на три окремі `npm:`-записи: зріз 6 контракту
# (`n-rules` — самостійний бінарник, npm-канал геть) знімає неявну
# гарантію присутності `bun`/`bunx` у консюмера (доккомент `ESLINT_TOOL` у
# `src/lib.rs`). `path:bun` лишається — `bun/licensee` виконує саме
# `bun`-підкоманду.
tools = ["path:bun", "npm:stylelint", "npm:eslint", "npm:oxlint", "npm:jscpd", "path:tee"]
# Сорок шість контрибуцій концернів (задача N2 + Q1 батч 1 + Q2 батч 2 +
# Q3 + Q4 батч 4 + storybook-батч 5 + батчі 6–9, передумова full-scope
# мосту): scope/glob дзеркалять `plugins/lang-js/rules/**/concern.json` цих
# самих концернів із двома свідомими винятками — глоби storybook-сімейства
# ШИРШІ за `concern.json` (доккомент `build_manifest` у `src/lib.rs`, секція
# «Батч 5»), а глоби кластера `npm-module/*` батчу 7 — навпаки ВУЖЧІ
# (секція «Батч 7»: batch має нести рівно те, що JS-канон читає з диска);
# чотири контрибуції батчу 8 (`bun/layout`, `style/tooling`,
# `test/sandbox-aware-test`, `test/vitest-api-conventions`) — той самий
# принцип «рівно те, що канон читає»: кореневі імена без `**/`, плюс `.yarn`
# поруч із `.yarn/**` (`existsSync` JS-канону true і для файлу з таким
# іменем — секція «Батч 8» у `src/lib.rs`).
# Вісім (`js/utils_imports`, `test/no-relative-fs-path` — задача Q3;
# `js-bun-redis/imports`, `js-mssql/deps`, `js-bun-db/safety` — задача Q4
# батч 4; `test/storybook-vitest-config` — батч 6;
# `npm-module/package_structure`, `js/dep-policy` — батч 7) — справжні
# AST-концерни через `oxc_parser` (byte-exact parity з JS-каноном), не
# regex-порт. Де-скоуп батчу 2 для трьох SQL/redis-концернів знято:
# regex-groundwork у `src/lib.rs` замінено повноцінними AST-реалізаціями
# (доккомент секції «Батч 4» в `src/lib.rs`). Три `*/package_json` (батч 6)
# — порти Rego-полісі, не JS-детекторів.
[[concerns]]
key = "vue/tfm-translations"
scope = "per-file"
glob = ["**/*.vue"]

[[concerns]]
key = "style/gap"
scope = "full"
glob = ["**/*.vue", "**/*.scss", "**/*.css"]

[[concerns]]
key = "test/vitest-config-pool-forks"
scope = "full"
glob = ["vitest.config.mjs", "vitest.config.js"]

[[concerns]]
key = "test/no-process-chdir"
scope = "full"
glob = ["**/*.test.mjs", "**/*.test.js"]

[[concerns]]
key = "style/admin_table"
scope = "full"
glob = ["**/*.vue", "**/*.scss", "**/*.css"]

[[concerns]]
key = "style/quasar_fixes"
scope = "full"
glob = ["**/*.vue", "**/*.scss", "**/*.css"]

[[concerns]]
key = "test/location"
scope = "full"
glob = ["**/*.test.mjs"]

[[concerns]]
key = "test/no-console-store-restore"
scope = "full"
glob = ["**/*.test.mjs", "**/*.test.js"]

[[concerns]]
key = "test/no-bun-test-import"
scope = "full"
glob = ["**/*.test.mjs", "**/*.test.js"]

[[concerns]]
key = "js/utils_imports"
scope = "full"
glob = ["**/utils/**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"]

[[concerns]]
key = "test/no-relative-fs-path"
scope = "full"
glob = ["**/*.test.mjs", "**/*.test.js"]

[[concerns]]
key = "js-bun-redis/imports"
scope = "full"
glob = ["**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}", "**/package.json"]

[[concerns]]
key = "js-mssql/deps"
scope = "full"
glob = ["**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}", "**/package.json"]

[[concerns]]
key = "js-bun-db/safety"
scope = "full"
glob = ["**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}", "**/package.json"]

[[concerns]]
key = "test/storybook-scope"
scope = "full"
glob = [".n-rules.json", ".n-cursor.json", "**/package.json"]

[[concerns]]
key = "test/storybook-hygiene"
scope = "full"
glob = [
  ".n-rules.json",
  ".n-cursor.json",
  "**/package.json",
  "**/*.vue",
  "**/.storybook/**",
  "**/src/css/quasar.variables.scss",
  "**/src/css/quasar.variables.sass",
]

[[concerns]]
key = "test/storybook-page-coverage"
scope = "full"
glob = [
  ".n-rules.json",
  ".n-cursor.json",
  "**/package.json",
  "**/*.vue",
  "**/*.stories.js",
  "**/*.stories.ts",
]

[[concerns]]
key = "test/storybook-scaffold"
scope = "full"
glob = [".n-rules.json", ".n-cursor.json", "**/package.json", "**/*.vue", "**/.storybook/**"]
# §2.87: ширший за детект-глоб рівно на `**/src/components/**` — цю теку
# питає `detect_stories_glob` фіксу, детекту її вміст не потрібен.
fix_glob = [
  ".n-rules.json",
  ".n-cursor.json",
  "**/package.json",
  "**/*.vue",
  "**/.storybook/**",
  "**/src/components/**",
]

[[concerns]]
key = "test/storybook-ci"
scope = "full"
glob = [
  ".n-rules.json",
  ".n-cursor.json",
  "**/package.json",
  "**/*.vue",
  ".github/actions/setup-playwright-chromium/action.yml",
  ".github/workflows/lint-storybook.yml",
]
# §2.87: список той самий, що детекту, але оголошений ЯВНО — саме
# непорожній `fix_glob` вмикає в хості full-scope fix-батч (інакше гість
# дістав би лише два ВІДСУТНІ шляхи з діагностик, тобто порожній батч).
fix_glob = [
  ".n-rules.json",
  ".n-cursor.json",
  "**/package.json",
  "**/*.vue",
  ".github/actions/setup-playwright-chromium/action.yml",
  ".github/workflows/lint-storybook.yml",
]

[[concerns]]
key = "test/storybook-vitest-config"
scope = "full"
glob = [
  ".n-rules.json",
  ".n-cursor.json",
  "**/package.json",
  "**/*.vue",
  "**/vitest.config.mjs",
  "**/vitest.config.js",
  "**/vitest.config.ts",
  "**/vitest.stryker.config.*",
]

[[concerns]]
key = "js-bun-db/package_json"
scope = "full"
glob = ["**/package.json"]

[[concerns]]
key = "js-bun-redis/package_json"
scope = "full"
glob = ["**/package.json"]

[[concerns]]
key = "js-mssql/package_json"
scope = "full"
glob = ["**/package.json"]

[[concerns]]
key = "npm-module/rule_meta"
scope = "full"
glob = ["npm/rules/*/*"]

[[concerns]]
key = "npm-module/skill_meta"
scope = "full"
glob = ["npm/skills/*/*"]

[[concerns]]
key = "npm-module/header_doc_pointer"
scope = "full"
glob = ["npm/rules/*/js/*", "npm/rules/*/js/docs/*", "npm/skills/*/js/*", "npm/skills/*/js/docs/*"]

[[concerns]]
key = "npm-module/package_structure"
scope = "full"
glob = ["package.json", "npm", "npm/**", "hk.pkl", ".config/hk.pkl", ".github/workflows/**"]

[[concerns]]
key = "js/dep-policy"
scope = "full"
glob = ["**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"]

[[concerns]]
key = "bun/layout"
scope = "full"
glob = [
  "package-lock.json",
  "yarn.lock",
  "pnpm-lock.yaml",
  ".yarnrc.yml",
  ".yarn",
  ".yarn/**",
  "bun.lock",
  "bunfig.toml",
  "package.json",
]

[[concerns]]
key = "style/tooling"
scope = "full"
glob = [
  "package.json",
  ".stylelintrc.json",
  ".stylelintrc.js",
  ".stylelintrc.cjs",
  ".stylelintrc.mjs",
  "stylelint.config.js",
  "stylelint.config.cjs",
  "stylelint.config.mjs",
  ".stylelintignore",
]

[[concerns]]
key = "test/sandbox-aware-test"
scope = "full"
glob = ["**/*.test.mjs", "**/*.test.js"]

[[concerns]]
key = "test/vitest-api-conventions"
scope = "full"
glob = ["**/*.test.mjs", "**/*.test.js"]

# Батч 9: `concern.json` цього концерну глоба не має взагалі
# (`{ "lint": { "scope": "full" } }` — JS-канон бачив УВЕСЬ репозиторій), тож
# перелік нижче — точний відповідник того, що канон реально читає з диска:
# `[cm]?[jt]sx?`+`.vue` (import-скани) і решта розширень esbuild-скану
# (секція «Батч 9» у `src/lib.rs`).
[[concerns]]
key = "vue/packages"
scope = "full"
glob = [
  "**/*.{js,jsx,mjs,mjsx,cjs,cjsx,ts,tsx,mts,mtsx,cts,ctsx}",
  "**/*.{vue,json,jsonc,yaml,yml,md,mdc}",
]

# Зріз 1 контракту v3.1: глоб — `concern.json.lint.glob` плюс `.n-rules.json`
# (self-gate `js`-правила) і `.gitignore`, які канон читає повз `ctx.files`
# (секція «Зріз 1» у `src/lib.rs`).
[[concerns]]
key = "test/stryker_config"
scope = "full"
glob = [
  ".n-rules.json",
  ".n-cursor.json",
  ".gitignore",
  "**/package.json",
  "**/stryker.config.mjs",
  "**/stryker-vue-macros-ignorer.mjs",
  "**/vitest.config.{mjs,js}",
  "**/src/**/*.vue",
]

# Зріз 2 контракту v3.1: глоб — `concern.json.lint.glob` плюс `**/*.vue`
# (детекція vue-воркспейсів `isVueWorkspace`, секція «Зріз 2» у `src/lib.rs`).
[[concerns]]
key = "js/check"
scope = "full"
glob = [
  "eslint.config.js",
  "eslint.config.mjs",
  "**/package.json",
  "**/*.vue",
  ".oxlintrc.json",
  ".github/workflows/lint-js.yml",
  ".github/workflows/lint.yml",
  "knip.json",
  ".eslintrc",
  ".eslintrc.js",
  ".eslintrc.json",
  ".eslintrc.yml",
]

# Зріз 4 контракту v3.1: PER-FILE-контрибуція — глоб дослівно з
# `concern.json.lint.glob` JS-канону (`IGNORE_GLOBS` живуть у недосяжній
# globby-гілці `lint()`, секція «Зріз 4» у `src/lib.rs`).
[[concerns]]
key = "js/doc_comments"
scope = "per-file"
glob = ["**/*.{js,mjs,cjs,ts}"]

# Зріз 5 контракту v3.1 — пілот `exec-tool`. Глоб ВУЖЧИЙ за `concern.json`
# (який глоба не має взагалі, `{"lint": {"scope": "full"}}`): детектор читає
# з диска рівно `.licensee.json`, решту вердикту дає спавнений тул — той
# самий принцип «batch несе рівно те, що канон читає», що й батч 7.
# `**/package.json` додав порт T0-фіксера (`fix_bun_licensee`, патерн
# `bun-licensee-workspace-license-metadata`): щоб проставити власному
# workspace-пакету `"license": "ISC"`, гість мусить бачити його
# `package.json` у батчі. Детектор ці записи ігнорує.
[[concerns]]
key = "bun/licensee"
scope = "full"
glob = [".licensee.json", "**/package.json"]

# Зріз 6 контракту v3.1. `scope = "per-file"` — дослівно `concern.json`.
# Тут БУЛО `full` як обхід дефекту хоста (до §2.65 `per-file` діставав у
# `lint --full` порожній batch і концерн мовчки звітував «чисто»). §2.65
# полагодила detect-бік, порт T0-фіксера — fix-бік
# (`run_wasm_concern_fix`), тож обхід знято: на fix-боці `full` ІГНОРУЄ
# дельту запиту, тобто дельта-прогін ганяв би `stylelint --fix` по всьому
# репозиторію (секція «Зріз 6» у `src/lib.rs`).
[[concerns]]
key = "style/lint"
scope = "per-file"
glob = ["**/*.{css,scss,vue}"]

# Зріз 6 контракту v3.1. Глоб ПОРОЖНІЙ навмисно: канон не читає з диска
# нічого перед спавном — репозиторій обходить сам `jscpd`, а вердикт
# приїжджає JSON-звітом через `scratch-out`. Це той самий принцип «batch
# несе рівно те, що канон читає», доведений до нуля.
[[concerns]]
key = "js/jscpd_duplicates"
scope = "full"
glob = []

# Зріз 7 контракту v3.1 — найбільший поодинокий зріз §3.5.5 (дев'ять
# незалежних під-перевірок одного ключа). Глоб ШИРШИЙ за `concern.json` в
# одному місці: `**/k8s/**/*.{yaml,yml}` замість `**/k8s/base/configmap.yaml` —
# інакше
# гілка «каталог k8s/ є, а configmap немає» зникла б мовчки (доккомент
# секції «Зріз 7» у `src/lib.rs`). Жодного тула цей концерн НЕ декларує:
# вимір показав, що `runConftestBatch` у JS-канону вакуумний, тож
# `pinned:conftest` і `scratch-in` тут не потрібні (там же).
[[concerns]]
key = "js-run/runtime"
scope = "full"
glob = [
  "**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}",
  "**/package.json",
  "**/jsconfig.json",
  "**/k8s/**/*.{yaml,yml}",
]

# §2.78 — родина `vscode_extensions` + четвірка `package_json`: ПЕРША хвиля
# цього гостя, чий детект — вшита `.rego`-політика, оцінена через host-import
# `rego-engine` (§2.66), а не власний Rust-сканер. Глоб кожного концерну —
# рівно його `policy.files.single`: після §2.72 той самий глоб годує і
# `detect`, і `fix`, тож вужчий за таргет глоб беззвучно каструє фікс.
[[concerns]]
key = "js/vscode_extensions"
scope = "full"
glob = [".vscode/extensions.json"]

[[concerns]]
key = "style/vscode_extensions"
scope = "full"
glob = [".vscode/extensions.json"]

[[concerns]]
key = "js/package_json"
scope = "full"
glob = ["package.json"]

[[concerns]]
key = "npm-module/npm_package_json"
scope = "full"
glob = ["npm/package.json"]

[[concerns]]
key = "npm-module/root_package_json"
scope = "full"
glob = ["package.json"]

[[concerns]]
key = "style/package_json"
scope = "full"
glob = ["package.json"]

# §2.80 — той самий rego-детект на решті конфіг-подібних концернів:
# `style/vscode_settings` (ОСТАННІЙ незакритий член родини
# `vscode_*`/`zed_settings`), `js/jscpd_config`,
# `npm-module/emit_types_config` і `js-run/jsconfig`. Перші три —
# `policy.files.single`, тож глоб = таргет; `js-run/jsconfig` —
# `files.walkGlob`, єдиний багатофайловий policy-концерн цього гостя.
[[concerns]]
key = "style/vscode_settings"
scope = "full"
glob = [".vscode/settings.json"]

[[concerns]]
key = "js/jscpd_config"
scope = "full"
glob = [".jscpd.json"]

[[concerns]]
key = "npm-module/emit_types_config"
scope = "full"
glob = ["npm/tsconfig.emit-types.json"]

[[concerns]]
key = "js-run/jsconfig"
scope = "full"
glob = ["**/jsconfig.json"]

# §2.86, мажор контракту `4.0.0` (§2.84) — ОКРЕМИЙ список контрибуцій:
# плагін дає для цих ключів ЛИШЕ `fix`, а детект лишається за чинною
# JS-реалізацією (`main.mjs`). Ключ тут НЕ вмикає detect-шедоуїнг —
# `detect.mjs` читає лише `concerns`. `js/eslint` — «вічний JS» на боці
# детекту (programmatic API `eslint` + LLM-контур `agent-fix`), тож
# оголосити його у `concerns` заради самого лише фіксу означало б мовчки
# вимкнути детект.
[[fix_only_concerns]]
key = "js/eslint"
scope = "per-file"
glob = ["**/*.{js,mjs,cjs,jsx,ts,tsx,vue}"]

[capabilities]
# Хост передає вміст файлів inline у `detect-batch`/`fix-request` (як
# per-file, так і host-побудований full-scope batch) — плагін не читає диск
# сам.
fs_read = []
network = false
