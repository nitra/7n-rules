# Маніфест wasm-плагіна `lang-js/wasm-concerns` (задачі N2, Q1 батч 1, Q2
# батч 2, Q3, Q4 батч 4 та storybook-батч 5 — де-скоуп до byte-exact-парних
# концернів, спека
# `docs/specs/2026-07-31-plugin-contract-v3-wasm-component.md` §3.5.5 і
# `docs/specs/2026-08-01-wasm-ast-strategy.md`) —
# статичний дублікат того, що `describe()` (src/lib.rs) повертає в рантаймі.
# Поля 1:1 відповідають `rules_contract::manifest::Manifest`
# (crates/rules-contract/src/manifest.rs, без serde-перейменувань — назви
# полів тотожні Rust-структурі). Хост читає цей файл лише як довідку для
# людини й дистрибуційний supplement — джерело правди в рантаймі завжди
# `describe()` (не парситься назад у `PluginHost`, спека §3.1).
#
# TODO(v3-wasm-first-party-pins): це dev-форма піна (`{ name, path }` у
# секції `wasmPlugins` .n-rules.json споживача) — `url` + `sha256`
# дистрибуція (спека §3.4, рішення Ж) — наступний крок, поза обсягом задачі N2.

id = "lang-js/wasm-concerns"
version = "0.1.0"
world_version = "3.0.0"
domains = ["lint"]
# Тридцять три контрибуції концернів (задача N2 + Q1 батч 1 + Q2 батч 2 +
# Q3 + Q4 батч 4 + storybook-батч 5 + батчі 6–9, передумова full-scope
# мосту): scope/glob дзеркалять `plugins/lang-js/rules/**/concern.json` цих
# самих концернів із двома свідомими винятками — глоби storybook-сімейства
# ШИРШІ за `concern.json` (доккомент `build_manifest` у `src/lib.rs`, секція
# «Батч 5»), а глоби кластера `npm-module/*` батчу 7 — навпаки ВУЖЧІ
# (секція «Батч 7»: batch має нести рівно те, що JS-канон читає з диска);
# чотири контрибуції батчу 8 (`bun/layout`, `style/tooling`,
# `test/sandbox-aware-test`, `test/vitest-api-conventions`) — той самий
# принцип «рівно те, що канон читає»: кореневі імена без `**/`, плюс `.yarn`
# поруч із `.yarn/**` (`existsSync` JS-канону true і для файлу з таким
# іменем — секція «Батч 8» у `src/lib.rs`).
# Вісім (`js/utils_imports`, `test/no-relative-fs-path` — задача Q3;
# `js-bun-redis/imports`, `js-mssql/deps`, `js-bun-db/safety` — задача Q4
# батч 4; `test/storybook-vitest-config` — батч 6;
# `npm-module/package_structure`, `js/dep-policy` — батч 7) — справжні
# AST-концерни через `oxc_parser` (byte-exact parity з JS-каноном), не
# regex-порт. Де-скоуп батчу 2 для трьох SQL/redis-концернів знято:
# regex-groundwork у `src/lib.rs` замінено повноцінними AST-реалізаціями
# (доккомент секції «Батч 4» в `src/lib.rs`). Три `*/package_json` (батч 6)
# — порти Rego-полісі, не JS-детекторів.
[[concerns]]
key = "vue/tfm-translations"
scope = "per-file"
glob = ["**/*.vue"]

[[concerns]]
key = "style/gap"
scope = "full"
glob = ["**/*.vue", "**/*.scss", "**/*.css"]

[[concerns]]
key = "test/vitest-config-pool-forks"
scope = "full"
glob = ["vitest.config.mjs", "vitest.config.js"]

[[concerns]]
key = "test/no-process-chdir"
scope = "full"
glob = ["**/*.test.mjs", "**/*.test.js"]

[[concerns]]
key = "style/admin_table"
scope = "full"
glob = ["**/*.vue", "**/*.scss", "**/*.css"]

[[concerns]]
key = "style/quasar_fixes"
scope = "full"
glob = ["**/*.vue", "**/*.scss", "**/*.css"]

[[concerns]]
key = "test/location"
scope = "full"
glob = ["**/*.test.mjs"]

[[concerns]]
key = "test/no-console-store-restore"
scope = "full"
glob = ["**/*.test.mjs", "**/*.test.js"]

[[concerns]]
key = "test/no-bun-test-import"
scope = "full"
glob = ["**/*.test.mjs", "**/*.test.js"]

[[concerns]]
key = "js/utils_imports"
scope = "full"
glob = ["**/utils/**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"]

[[concerns]]
key = "test/no-relative-fs-path"
scope = "full"
glob = ["**/*.test.mjs", "**/*.test.js"]

[[concerns]]
key = "js-bun-redis/imports"
scope = "full"
glob = ["**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}", "**/package.json"]

[[concerns]]
key = "js-mssql/deps"
scope = "full"
glob = ["**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}", "**/package.json"]

[[concerns]]
key = "js-bun-db/safety"
scope = "full"
glob = ["**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}", "**/package.json"]

[[concerns]]
key = "test/storybook-scope"
scope = "full"
glob = [".n-rules.json", ".n-cursor.json", "**/package.json"]

[[concerns]]
key = "test/storybook-hygiene"
scope = "full"
glob = [
  ".n-rules.json",
  ".n-cursor.json",
  "**/package.json",
  "**/*.vue",
  "**/.storybook/**",
  "**/src/css/quasar.variables.scss",
  "**/src/css/quasar.variables.sass",
]

[[concerns]]
key = "test/storybook-page-coverage"
scope = "full"
glob = [
  ".n-rules.json",
  ".n-cursor.json",
  "**/package.json",
  "**/*.vue",
  "**/*.stories.js",
  "**/*.stories.ts",
]

[[concerns]]
key = "test/storybook-scaffold"
scope = "full"
glob = [".n-rules.json", ".n-cursor.json", "**/package.json", "**/*.vue", "**/.storybook/**"]

[[concerns]]
key = "test/storybook-ci"
scope = "full"
glob = [
  ".n-rules.json",
  ".n-cursor.json",
  "**/package.json",
  "**/*.vue",
  ".github/actions/setup-playwright-chromium/action.yml",
  ".github/workflows/lint-storybook.yml",
]

[[concerns]]
key = "test/storybook-vitest-config"
scope = "full"
glob = [
  ".n-rules.json",
  ".n-cursor.json",
  "**/package.json",
  "**/*.vue",
  "**/vitest.config.mjs",
  "**/vitest.config.js",
  "**/vitest.config.ts",
  "**/vitest.stryker.config.*",
]

[[concerns]]
key = "js-bun-db/package_json"
scope = "full"
glob = ["**/package.json"]

[[concerns]]
key = "js-bun-redis/package_json"
scope = "full"
glob = ["**/package.json"]

[[concerns]]
key = "js-mssql/package_json"
scope = "full"
glob = ["**/package.json"]

[[concerns]]
key = "npm-module/rule_meta"
scope = "full"
glob = ["npm/rules/*/*"]

[[concerns]]
key = "npm-module/skill_meta"
scope = "full"
glob = ["npm/skills/*/*"]

[[concerns]]
key = "npm-module/header_doc_pointer"
scope = "full"
glob = ["npm/rules/*/js/*", "npm/rules/*/js/docs/*", "npm/skills/*/js/*", "npm/skills/*/js/docs/*"]

[[concerns]]
key = "npm-module/package_structure"
scope = "full"
glob = ["package.json", "npm", "npm/**", "hk.pkl", ".config/hk.pkl", ".github/workflows/**"]

[[concerns]]
key = "js/dep-policy"
scope = "full"
glob = ["**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"]

[[concerns]]
key = "bun/layout"
scope = "full"
glob = [
  "package-lock.json",
  "yarn.lock",
  "pnpm-lock.yaml",
  ".yarnrc.yml",
  ".yarn",
  ".yarn/**",
  "bun.lock",
  "bunfig.toml",
  "package.json",
]

[[concerns]]
key = "style/tooling"
scope = "full"
glob = [
  "package.json",
  ".stylelintrc.json",
  ".stylelintrc.js",
  ".stylelintrc.cjs",
  ".stylelintrc.mjs",
  "stylelint.config.js",
  "stylelint.config.cjs",
  "stylelint.config.mjs",
  ".stylelintignore",
]

[[concerns]]
key = "test/sandbox-aware-test"
scope = "full"
glob = ["**/*.test.mjs", "**/*.test.js"]

[[concerns]]
key = "test/vitest-api-conventions"
scope = "full"
glob = ["**/*.test.mjs", "**/*.test.js"]

# Батч 9: `concern.json` цього концерну глоба не має взагалі
# (`{ "lint": { "scope": "full" } }` — JS-канон бачив УВЕСЬ репозиторій), тож
# перелік нижче — точний відповідник того, що канон реально читає з диска:
# `[cm]?[jt]sx?`+`.vue` (import-скани) і решта розширень esbuild-скану
# (секція «Батч 9» у `src/lib.rs`).
[[concerns]]
key = "vue/packages"
scope = "full"
glob = [
  "**/*.{js,jsx,mjs,mjsx,cjs,cjsx,ts,tsx,mts,mtsx,cts,ctsx}",
  "**/*.{vue,json,jsonc,yaml,yml,md,mdc}",
]

ci_artifacts = []
tools = []

[capabilities]
# Хост передає вміст файлів inline у `detect-batch`/`fix-request` (як
# per-file, так і host-побудований full-scope batch) — плагін не читає диск
# сам.
fs_read = []
network = false
