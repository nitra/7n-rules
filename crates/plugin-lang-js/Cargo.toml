[package]
name = "plugin-lang-js"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "wasm-компонент n-rules:plugin@3.0.0 — lang-js/wasm-concerns (vue/tfm-translations, style/gap)"

[lib]
# `cdylib` — обов'язково: `wasm32-wasip2` виводить готовий Component Model
# компонент лише з цього crate-type (той самий мотив, що й
# `crates/test-plugin-guest`, скасований `crates/plugin-lang-js-pilot`).
crate-type = ["cdylib"]

[dependencies]
# Пін звірено з `npm/skills/wasm-plugin/SKILL.md` (той самий мінор, що
# резолвиться в Cargo.lock кореня) — НЕ розширюй у caret-діапазон без причини
# (доккомент шаблону `npm/skills/wasm-plugin/template/Cargo.toml.tpl`).
wit-bindgen = "0.60"
# Порт regex-ів обох концернів (vue/tfm-translations: TFM_IMPORT_RE/
# TF_SPECIFIER_RE/GET_TR_DECL_RE; style/gap: USAGE_RE/DEFINITION_RE) 1:1 —
# жодного lookaround у жодному з них, прямий перенос у regex-крейт.
regex = "1"
