[package]
name = "plugin-lang-js"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "wasm-компонент n-rules:plugin@4.0.0 — lang-js/wasm-concerns (46 контрибуцій: vue/tfm-translations, vue/packages, style/gap, style/admin_table, style/quasar_fixes, style/tooling, style/lint, bun/layout, bun/licensee, test/* — location, no-process-chdir, no-console-store-restore, no-bun-test-import, no-relative-fs-path, vitest-config-pool-forks, sandbox-aware-test, vitest-api-conventions, storybook-сімейство і storybook-vitest-config, js/utils_imports, js/dep-policy, js/jscpd_duplicates, js-bun-redis/*, js-mssql/*, js-bun-db/*, npm-module/* — rule_meta, skill_meta, header_doc_pointer, package_structure, test/stryker_config, js/check, js/doc_comments, і шість rego-детектів §2.78 — js/vscode_extensions, style/vscode_extensions, js/package_json, npm-module/npm_package_json, npm-module/root_package_json, style/package_json)"

[lib]
# `cdylib` — обов'язково: `wasm32-wasip2` виводить готовий Component Model
# компонент лише з цього crate-type (той самий мотив, що й
# `crates/test-plugin-guest`, скасований `crates/plugin-lang-js-pilot`).
crate-type = ["cdylib"]

[dependencies]
# Пін звірено з `npm/skills/wasm-plugin/SKILL.md` (той самий мінор, що
# резолвиться в Cargo.lock кореня) — НЕ розширюй у caret-діапазон без причини
# (доккомент шаблону `npm/skills/wasm-plugin/template/Cargo.toml.tpl`).
wit-bindgen = "0.60"
# Порт regex-ів перших семи концернів (vue/tfm-translations: TFM_IMPORT_RE/
# TF_SPECIFIER_RE/GET_TR_DECL_RE; style/gap: USAGE_RE/DEFINITION_RE;
# test/vitest-config-pool-forks: POOL_FORKS_RE; test/no-process-chdir:
# CHDIR_CALL_RE; style/admin_table: USAGE_RE/DEFINITION_RE; style/quasar_fixes:
# FIXES[].usage/definition) 1:1 — жодного lookaround у жодному з них, прямий
# перенос у regex-крейт. Два концерни задачі Q2 батч 2 (test/no-console-store-restore,
# test/no-bun-test-import — справжній 1:1) теж лишаються в цьому самому
# regex-крейті, без додаткових залежностей. AST-концерни батчу 4
# (js-bun-redis/imports, js-bun-db/safety, js-mssql/deps) використовують
# regex лише для дрібних текстових предикатів JS-оригіналів
# (SQL_LIST_CONTEXT_RE, маркерні коментарі, pre-filter-и) — семантика коду
# йде через oxc_parser нижче.
#
# `default-features = false` + явний список (задача size-budget): дефолтна
# фіча `unicode` тягне СІМ незалежних наборів Unicode-таблиць, а звертаються
# до них лише класи `\p{…}`/`\P{…}` — у жодному з ~80 патернів цього крейта
# таких класів немає (порти JS-патернів, звірено grep-ом). Лишені рівно ті
# два набори, що впливають на семантику ВЖИВАНИХ конструкцій:
# - `unicode-perl` — `\w`/`\d`/`\s`/`\b` (є в патернах; без цієї фічі вони
#   звузились би до ASCII, тобто змінили б поведінку на не-ASCII вводі);
# - `unicode-case` — case-folding для `(?i)` (є один патерн, `(?i)stories`).
# Викинуті: `unicode-age`, `unicode-bool`, `unicode-gencat`, `unicode-script`,
# `unicode-segment` — усі доступні ЛИШЕ через `\p{…}`, тож зріз таблиць
# семантично порожній (виміряно: −232 904 байти артефакта, −9,3 %).
# `perf` лишається дефолтним — це швидкодія матчингу, не семантика.
regex = { version = "1", default-features = false, features = [
  "std",
  "perf",
  "unicode-case",
  "unicode-perl",
] }
# AST-концерни (задача Q3, `docs/specs/2026-08-01-wasm-ast-strategy.md`,
# розділ «Рішення» п.1): `js/utils_imports`/`test/no-relative-fs-path`
# JS-оригінали парсять напряму через npm `oxc-parser` — byte-exact parity
# вимагає ТОГО САМОГО двигуна на боці guest-а. Пін синхронізовано з
# `npm/package.json:dependencies.oxc-parser` (точна версія, не caret-діапазон
# — той самий мотив, що `wit-bindgen` вище); дзеркальний тест версій —
# `npm/scripts/lib/lint-surface/tests/oxc-version-pin.test.mjs`. Парсер живе
# прямо в guest-компоненті (без host-медіації) — рішення спайка S1, жодного
# нового host-контракту чи WIT-розширення не потрібно.
#
# `default-features = false` (задача size-budget) вимикає єдину дефолтну
# feature `regular_expression`: з нею парсер додатково РОЗБИРАЄ тіло кожного
# regex-літерала окремим під-парсером (`oxc_regular_expression` + власні
# Unicode-таблиці властивостей) і кладе результат у
# `RegExpLiteral.regex.pattern: Option<Box<Pattern>>`. Цей крейт читає ЛИШЕ
# `regex.pattern.text` (сирий текст літерала — `Str<'a>`, заповнюється
# незалежно від фічі; єдине місце — `PgPlaceholderFinder::visit_reg_exp_literal`),
# а поле `pattern` не торкає ніде. Тобто вимкнення міняє з `Some(..)` на
# `None` рівно те поле, якого ніхто не читає — parity недоторканий
# (виміряно: −91 306 байтів артефакта, −3,7 %).
oxc_parser = { version = "=0.137.0", default-features = false }
oxc_ast = "=0.137.0"
oxc_allocator = "=0.137.0"
oxc_span = "=0.137.0"
# Visitor-трейт для повного обходу AST (динамічний `import()`, `require()` —
# можуть бути ГЛИБОКО вкладені, не лише на верхньому рівні `Program.body`,
# на відміну від `ImportDeclaration`, валідного лише на toplevel) — та сама
# версія, той самий репозиторій `oxc-project/oxc`, що решта `oxc_*` вище.
oxc_ast_visit = "=0.137.0"
# `ScopeFlags` для сигнатури `Visit::visit_function` (лічильник «всередині
# функції» AST-концернів батчу 4) — той самий пін, той самий репозиторій
# `oxc-project/oxc` (звіряється `oxc-version-pin.test.mjs`, як решта oxc_*).
oxc_syntax = "=0.137.0"
# Справжній JSON-парсинг package.json для `js-mssql/deps`/`js-bun-db/safety`
# (задача Q4 батч 4) — дзеркало `JSON.parse` JS-оригіналів (включно з
# «невалідний JSON»-fail-ом); regex-наближення JSON тут дало б розбіжність
# byte-exact parity. Caret-діапазон свідомо (не oxc-сімʼя, стабільний API).
serde_json = "1"
# Зріз 2 контракту v3.1 (`js/check`): власний `Deserialize` для
# [`JsonOrdered`] — JSON-значення зі ЗБЕРЕЖЕНИМ порядком ключів обʼєктів.
# `serde_json::Value` тримає обʼєкт у `BTreeMap` (ключі відсортовані), а
# byte-exact parity з `Object.entries()`/`JSON.stringify()` JS-канону вимагає
# саме документного порядку. Прямої залежності не уникнути: `serde` і так у
# графі як залежність `serde_json` (жодного приросту артефакта), але
# `Visitor`/`MapAccess` доступні лише через явний імпорт. Derive НЕ вмикаємо —
# impl написаний вручну.
serde = "1"
# Родина `vscode_extensions`/`package_json` (§2.78): спільний двигун
# template-merge (§2.71) — ТОЙ САМИЙ крейт, що бере нативна колія
# (`crates/rules-core/src/concerns/fix_template_merge.rs`) і гості
# `ci-github`/`ci-azure`. Розходження семантики мержу між колiями
# неможливе за побудовою.
#
# Фіча `yaml` СВІДОМО не вмикається (лишається дефолтний `jsonc`): усі шість
# таргетів цієї хвилі — `.vscode/extensions.json`, `package.json`,
# `npm/package.json` — чистий JSON/JSONC. `saphyr` у wasm32-артефакт цього
# гостя не потрапляє взагалі (найбільший гість, 21,7% бюджету — доккомент
# `default-features = false` вище про той самий мотив).
#
# Побічний, але важливий наслідок: `rules_template_merge::Json::Object` —
# `Vec<(String, Json)>`, тобто ДОКУМЕНТНИЙ порядок ключів (§2.87: до фіксу
# фічі `preserve_order` у `jsonc-parser` це твердження було ХИБНЕ саме для
# JSONC-гілки — вектор наповнювався з `HashMap`, тобто у хеш-порядку, і
# щоразу в іншому; тепер воно справджується) (на відміну від
# `serde_json::Value`/`BTreeMap`). Саме те, чого вимагає byte-exact parity з
# `JSON.stringify(obj, null, 2)` JS-канону; окремий [`JsonOrdered`] цій
# родині НЕ потрібен.
rules-template-merge = { path = "../rules-template-merge" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Реєстр §2.66/§2.78: `regorus` виконується IN-PROCESS лише на host-таргеті
# (нативні `cargo test`) — той самий `rules-rego-engine`, що
# `crates/rules-plugin-host` реалізує через host-import resource
# `rego-engine` для wasm32 (доккомент `RegoEngineHandle`, `src/lib.rs`).
# Cargo резолвить цю залежність ЛИШЕ на не-wasm32 таргеті — у
# wasm32-wasip2 build graph цього ребра немає, `regorus`/`regex` НЕ
# резолвиться в component-артефакт узагалі. Той самий мотив і та сама
# форма, що `crates/plugin-ci-azure/Cargo.toml`.
rules-rego-engine = { path = "../rules-rego-engine" }

[dev-dependencies]
# Anti-drift тест `plugin_toml_concern_keys_match_describe` парсить
# `plugin.toml` СПРАВЖНІМ TOML-парсером, а не порядковим скануванням: лише так
# ловиться клас дрейфу «поле опинилось після заголовка `[[concerns]]`» (TOML
# відніс би його до останнього елемента масиву, а не до кореня маніфеста).
# Той самий мінор, що `crates/rules-core` — резолвиться з Cargo.lock кореня.
# Dev-only: у wasm32-wasip2 cdylib не потрапляє.
toml = "0.8"
