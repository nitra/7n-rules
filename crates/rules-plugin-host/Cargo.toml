[package]
name = "rules-plugin-host"
version = "0.1.0"
edition = "2021"
description = "Embedded wasmtime-хост для n-rules:plugin@4.0.0 (crates/rules-contract): завантаження wasm-компонентів, WASI preopens за capabilities, вузький публічний trait поверх Component Model, host-import rego-engine (crates/rules-rego-engine)"
license = "Apache-2.0"

[lib]
name = "rules_plugin_host"

[dependencies]
rules-contract = { path = "../rules-contract" }
# Реалізація host-import resource `rego-engine` (`wit/world.wit`, реєстр
# §2.66) делегує СЮДИ — той самий крейт, що `plugin-ci-github` підключає
# нативно під `cfg(not(wasm32))`, єдине джерело істини для rego-семантики
# (доккомент модуля `rules-rego-engine`).
rules-rego-engine = { path = "../rules-rego-engine" }
# Пін точної minor-версії (не caret-діапазон) — рішення М спеки
# `docs/specs/2026-07-31-plugin-contract-v3-wasm-component.md`: Component
# Model API wasmtime ще нестабілізований між minor-релізами, тож пін
# оновлюється КОЖЕН minor свідомо через звичайний taze-флоу (не автоматично
# діапазоном версій), а regression-гейт — прогін contract-test-kit
# (`tests/`) проти реальної guest-фікстури (`crates/test-plugin-guest`) на
# кожному оновленні піна. `default-features = false` звужує features до
# фактично потрібних: `component-model` (Component Model ABI/біндінги),
# `cranelift` (компіляція wasm → native), `runtime` (Store/Instance/пам'ять
# — сама можливість виконання), `std`.
wasmtime = { version = "48.0", default-features = false, features = [
  "component-model",
  "cranelift",
  "runtime",
  "std",
  # `wasmtime::Error` навмисно НЕ реалізує `std::error::Error` (той самий
  # trait-coherence компроміс, що й у `anyhow`) — конверсія в `anyhow::Error`
  # (яка й реалізує `std::error::Error`, потрібний thiserror `#[source]`)
  # існує лише під цією feature (`impl From<wasmtime::Error> for
  # anyhow::Error`, `wasmtime-internal-core/src/error/error.rs`).
  "anyhow",
] }
# WASI Preview 2 host-реалізація (той самий пін-каданс, що й `wasmtime`
# вище — обидва крейти з одного релізного потяга bytecodealliance/wasmtime,
# тому версії тримаються синхронно). Дає `wasmtime_wasi::p2::WasiCtxBuilder`
# для preopen-ів за capabilities (рішення Е спеки) — мережа заборонена за
# замовчуванням через `WasiCtx`-політику (`allow_tcp`/`allow_udp`/
# `allow_ip_name_lookup` лишаються `false`, доккомент `PluginHost::new` у
# `src/host.rs`), не через відсутність wasi:sockets у `Linker`.
wasmtime-wasi = { version = "48.0", default-features = false, features = [
  "p2",
] }
thiserror = "1"
serde_json = "1"
# Scratch-контур `exec-tool` (`src/scratch.rs`, зріз 5 контракту v3.1):
# тимчасовий каталог обміну з тулом, який має зникнути разом із
# `detect`/`fix`-викликом — `TempDir` дає рівно цю семантику (рекурсивне
# видалення в `Drop`), без власного обліку створених шляхів. Уже був
# dev-залежністю цього крейта (тести `ToolResolver`) — тепер і в
# продакшн-графі, той самий мінор.
tempfile = "3"
# Матчинг `scratch-out`-глобів (`src/scratch.rs`) — ТОЙ САМИЙ крейт і та
# сама семантика, якою `crates/rules-napi::build_full_scope_files` фільтрує
# `concern-contribution.glob`; WIT обіцяє гостю «той самий синтаксис», і
# єдиний спосіб не збрехати — той самий матчер, а не власний.
globset = "0.4"
# Тип `#[source]`-полів `PluginHostError` (`src/error.rs`) — `wasmtime::Error`
# конвертується сюди через `From` (feature `anyhow` вище на `wasmtime`).
anyhow = "1"

# cspell:ignore libc globset
# `ToolResolver` (`src/tool_resolver.rs`, задача N1): таймаут run-tool-виклику
# вбиває не лише прямого дочірнього процеса, а ВСЮ process group (`kill(-pid,
# SIGKILL)`) — доккомент `kill_process_tree` пояснює, чому: скрипт-обгортка
# (типовий tool — shellcheck/eslint-подібний) може форкнути дочірній процес
# (не exec-замінити себе), який успадковує stdout/stderr pipe; вбивство лише
# top-level PID лишає той pipe відкритим, і наш reader-потік блокується аж
# до природного завершення "онука" (емпірично підтверджено — таймаут-тест
# `run_resolved_tool_times_out_and_kills_process` без цього фікса чекав
# повні 5с скрипта замість інʼєктованих 150мс). Уже присутній у дереві
# транзитивно (через `wasmtime`) — прямий пін лише формалізує вже наявну
# залежність.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

