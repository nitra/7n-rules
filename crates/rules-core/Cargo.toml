[package]
name = "rules-core"
version = "0.1.0"
edition = "2021"
description = "Rust-ядро @7n/rules: deterministic rule engine, Git-запити, filesystem scan, diagnostics, cache і fix plans"
license = "Apache-2.0"

[lib]
name = "rules_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Спільні DTO fix-домену (`FixPlan`/`FileEdit`/`WriteFile`) — злиття дзеркала
# `concerns/fix.rs` ⇄ `rules_contract::fix` (доккомент модуля
# `concerns/fix.rs`): напрямок залежності `rules-core` → `rules-contract` —
# той, що документує `rules-contract/src/lib.rs` («лише в один бік»); крейт —
# чистий serde-DTO шар без WIT-кодогенерації і wasm-рушія.
rules-contract = { path = "../rules-contract" }
# Спільний двигун template-merge (§2.71) — одне джерело істини семантики
# мержу для ОБОХ колiй міграції: ядрові концерни родини
# `vscode_*`/`zed_settings`/`oxfmtrc` (`concerns/fix_template_merge.rs`) і
# wasm-гості `ci-github`/`ci-azure`. Дефолтна фіча `jsonc` — рівно те, що
# потрібно ядру: ядрова частина родини це виключно JSON/JSONC-таргети, тож
# фіча `yaml` (і `saphyr` за нею) сюди СВІДОМО не тягнеться.
rules-template-merge = { path = "../rules-template-merge", features = ["yaml"] }
# Пін 0.86 синхронно з mt-rust (Р4 спеки). default-features=false: лише
# локальні commit-graph запити (merge-base, rev-parse) — без мережевих
# transport-фіч, потрібних mt-core для fetch/push. `revision` дає
# `Repository::merge_base`/`rev_parse_single` (тягне `index`); `sha1` —
# object-hash backend для звичайних (не sha256) репозиторіїв.
gix = { version = "0.86", default-features = false, features = ["revision", "sha1"] }
# Р3 спеки: worktree lifecycle виключно через mt-core (репо публічний,
# конвенції тегів `mt-core-v*` на боці mt-rust ще нема — пін по `rev`, не по
# гілці). Пін оновлюється СИНХРОННО і СВІДОМО: коли mt-rust заводить теги,
# перейти на них; до того — оновлення rev тут = окремий (не автоматичний)
# крок ревʼю, той самий gix 0.86, що й тут (Р4 спеки) — cargo уніфікує
# єдину версію в дереві залежностей.
mt-core = { git = "https://github.com/nitra/mt-rust", rev = "8bdadf5a483ab0db9d62c2c25299edee4fa4c6b1" }
# Двигун ripgrep для filesystem scan (D1 фази 4а спеки) — той самий
# .gitignore-парсер, що й `rg`/`fd`, використовуємо замість ручного порту
# globby-логіки.
ignore = "0.4"
# Regex-порт JS-детекторів native-concern-ів (E1 фази 5). Без backreference-ів
# (crate `regex` — DFA-двигун, `\1` не підтримується): `VALUE_SECRET_RE`
# concern-а `sample_secret` порт через 3-way alternation замість групи з
# backreference (doc-комент `concerns/sample_secret.rs`).
regex = "1"
# TOML-парсинг для G1-кластеру native concern-ів (`tauri/cargo_mutants_config`,
# `tauri/gitignore_target`, `tauri/linux_deps`, `tauri/core_test_isolation`) —
# заміна `smol-toml` на боці Rust. `toml::Table` (= `toml::map::Map<String,
# Value>`) — прямий відповідник `Record<string, unknown>`, який повертає
# `parseToml` у JS-версіях.
toml = "0.8"
# YAML-парсинг для H1-кластеру native concern-ів (`abie/hc_pairing`,
# `abie/ua_node_selector`, `abie/ua_http_route`) — заміна пакета `yaml`
# (`parseAllDocuments`) на боці Rust. `serde_yaml` 0.9 архівований (з 2024,
# maintenance mode), але лишається стабільним і широко вживаним для read-only
# парсингу — той самий клас рішення, що й вибір `toml` для G1: перевага
# ergonomics/serde-сумісності над активністю супроводу. Альтернативи
# (`yaml-rust2` та схожі) не мають serde-сумісного `Value`, довелося б писати
# власний конвертер `Yaml -> serde_json::Value` вручну; `serde_yaml::Value`
# вже `Serialize`, тож `serde_json::to_value(&yaml_value)` дає прямий
# еквівалент `doc.toJSON()` пакета `yaml` без додаткового коду (докладніше —
# doc-комент `concerns/abie_yaml.rs`). Мультидокументний парсинг (аналог
# `parseAllDocuments`) — через `serde_yaml::Deserializer::from_str`, ітератор
# per-document deserializer-ів (той самий лінивий підхід: помилка в одному
# документі не валить решту потоку).
serde_yaml = "0.9"
# cspell:ignore globset picomatch
# Glob-матчер lint-plan-контуру (P1 фази 7, `lint_plan` модуль): паритетний
# з JS `picomatch` matcher для `planConcernForDelta`/`buildDeltaPlan` тощо —
# порт glob ∩ changed із `run-detectors.mjs` (JS-бік стояв на пакеті `picomatch`).
# Той самий крейт, що вже транзитивно в дереві через `ignore` і прямо
# використовується `rules-napi` (full-scope batch, doc-комент там-таки) —
# пряма залежність тут не додає нового крейта в граф збірки.
globset = "0.4"
# `tiers`-модуль для `adr/hooks`-конкорна (PURE-фінал фази 5, Р9 спеки):
# `resolveModel`/`isLocalModel` еквіваленти. `default-features = false` —
# лише `tiers` (serde/thiserror-клас залежностей), без важкого
# genai/tokio/reqwest/agent-client-protocol стеку `agents`-фічі (ACP/batch/
# local_cloud), непотрібного lint-адону.
llm-lib = { version = "0.5", package = "n7n-llm-lib", default-features = false }
# Резолв зовнішнього CLI-тула в PATH (`tool_resolve::resolve_cmd`) —
# бібліотечний крейт замість ручного скану `PATH`+`PATHEXT` (Р11 п.1 спеки
# `docs/specs/2026-07-30-rules-v2-rust-core-migration.md`): активно
# підтримуваний, широковживаний `which(1)`-еквівалент екосистеми, і сам не
# спавнить субпроцес `which`/`where` (чисті `stat`/`access` через `libc`) —
# той самий клас гарантії, що дав JS-канону привід уникати субпроцесу.
# Default-фіча `real-sys` достатня; `regex`/`tracing` не потрібні.
which = "8"
# Тимчасовий файл `--data` для `conftest` (`conftest::run_conftest_batch_with_data`):
# JS-канон робить це руками (`mkdtempSync` + `rmSync` у `finally`), Rust бере
# зрілий крейт (Р11 п.1): каталог прибирається по `drop`, а не ручним
# `finally`, і він уже в дереві як dev-dependency — новий вузол у граф збірки
# не додається.
# Local-time timestamp формат для назв change-файлів (`concerns::change_file::write_change`,
# порт `formatChangeTimestamp`/`changeFileName` з `npm/rules/release/lib/change-file.mjs`):
# `new Date(timestamp)` + `getFullYear`/`getMonth`/`getDate`/`getHours`/`getMinutes`
# JS-канону читають системний ЛОКАЛЬНИЙ час — прямий відповідник тут `chrono::Local`.
# Уже транзитивно В ГРАФІ САМЕ rules-core через `mt-core` — звірено
# `cargo tree -p rules-core -e normal | grep chrono` (не workspace-wide
# `cargo tree -i chrono`, який показує зовсім інший граф: ту саму пастку
# розбирає коментар нижче про `ureq`, якого тут навмисно НЕМАЄ). Пряма
# залежність нового вузла графу не додає, лише синхронізує пін (0.4.45).
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
yamlpatch = "1.29.0"
yamlpath = "1.29.0"
yaml_serde = "0.10.7"
indexmap = "2.14.0"

[dev-dependencies]
tempfile = "3"
