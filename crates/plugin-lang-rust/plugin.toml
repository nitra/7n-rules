# Маніфест wasm-плагіна `rust/wasm-concerns` — ТРЕТІЙ first-party wasm-гість
# репозиторію (перший — `crates/plugin-lang-js`, другий —
# `crates/plugin-lang-python`, доккомент того `plugin.toml` пояснює саму
# форму). Перша хвиля порту: три концерни без зовнішніх тулів
# (`rust/applies`, `rust/doc_comments`, `rust/workspace_root`). ДРУГА хвиля
# додає ОДИН `exec-tool`-концерн (`rust/check`) і два T0-концерни
# (`rust/cargo_mutants_config`, `rust/wasm_component`) — доккомент модуля
# `src/lib.rs`. Поля 1:1 відповідають `rules_contract::manifest::Manifest`
# (crates/rules-contract/src/manifest.rs, без serde-перейменувань — назви
# полів тотожні Rust-структурі). Хост читає цей файл лише як довідник для
# людини й дистрибуційний supplement — джерело правди в рантаймі завжди
# `describe()` (не парситься назад у `PluginHost`, спека §3.1).

id = "rust/wasm-concerns"
version = "0.1.0"
world_version = "5.0.0"
domains = ["lint"]
# ТИМЧАСОВО порожньо: мажор `5.0.0` (§2.109 реєстру відкритих питань) додав
# поле `worlds`, реальна міграція шести гостей на декларації `caps`/
# `surfaces` — крок 4 спеки `docs/specs/2026-08-31-plugin-contract-v5.md`
# §12, окрема задача. До неї гість однаково НЕ інстанціюється на
# `5.x`-хості (`check_world_version` major-only).
worlds = []
# Top-level поля маніфеста — ОБОВʼЯЗКОВО перед першим `[[concerns]]`: після
# array-of-tables заголовка TOML відніс би їх до останнього елемента масиву,
# а не до кореня (та сама пастка, задокументована в
# `crates/plugin-lang-python/plugin.toml`).
ci_artifacts = []
# `rust/check` — ПІЛОТ `exec-tool` цього крейта (друга хвиля, доккомент
# `src/lib.rs`), схема `path:` (резолв по PATH, той самий мотив, що
# `path:uv` `crates/plugin-lang-python/plugin.toml`).
tools = ["path:cargo"]

[[concerns]]
key = "rust/applies"
scope = "full"
# `**/Cargo.toml` — точний відповідник `concern.json` цього концерну
# (`plugins/lang-rust/rules/rust/applies/concern.json`), ШИРШИЙ за
# кореневий-лише `pyproject.toml` python-сусіда: реальний гейт застосовності
# лежить декларативно в `rust/main.json:applies` (`globMatches`), цей
# концерн — чистий context-pass (доккомент `src/lib.rs`).
glob = ["**/Cargo.toml"]

[[concerns]]
key = "rust/doc_comments"
scope = "per-file"
glob = ["**/*.rs"]

[[concerns]]
# Друга (і поки остання) full-scope контрибуція цього крейта — єдиний
# концерн, що бачить УСЕ дерево репозиторію (host-batch за цим глобом +
# власний `RUST_WORKSPACE_ROOT_IGNORED_DIR_NAMES`-фільтр гостя,
# `crates/plugin-lang-rust/src/lib.rs::detect_workspace_root`). На відміну
# від `python/workspace_root` глоб НЕ несе lockfile-патерн: JS-канон
# (`plugins/lang-rust/rules/rust/workspace_root/main.mjs`) взагалі не
# перевіряє вкладені `Cargo.lock` (доккомент `src/lib.rs`).
key = "rust/workspace_root"
scope = "full"
glob = ["**/Cargo.toml"]

[[concerns]]
# `rust/check` — WHOLE-BATCH, ШИРШИЙ за `concern.json`-глоб канону
# (`**/*.rs`, `Cargo.toml`, `Cargo.lock` — не читаються взагалі, реальний
# вердикт дає `exec-tool`-ланцюжок `cargo fmt`/`cargo clippy`/`cargo deny`):
# лише ДВА root-only presence-сигнали (доккомент `src/lib.rs`).
key = "rust/check"
scope = "full"
glob = ["Cargo.toml", "deny.toml"]

[[concerns]]
# `rust/cargo_mutants_config` — WHOLE-BATCH: `**/Cargo.toml` + `package.json`
# (`resolve_all_cargo_manifests`, byte-у-byte порт
# `npm/scripts/utils/resolve-cargo-manifest.mjs`) + `**/.cargo/mutants.toml`
# (presence-ціль самої перевірки).
key = "rust/cargo_mutants_config"
scope = "full"
glob = ["**/Cargo.toml", "package.json", "**/.cargo/mutants.toml"]

[[concerns]]
# `rust/wasm_component` — PER-FILE, той самий глоб, що `concern.json`
# (`**/Cargo.toml`) — власний цільовий файл ЗАВЖДИ у батчі, doccomment
# `src/lib.rs` пояснює межу `{ workspace = true }`-успадкування.
key = "rust/wasm_component"
scope = "per-file"
glob = ["**/Cargo.toml"]

[[concerns]]
# Policy-концерн (`plugins/lang-rust/rules/rust/vscode_extensions/vscode_extensions.rego` + `template/extensions.json.snippet.json`, без
# `main.mjs`) — портовані ОБИДВІ половини, детект і фікс: `detect.mjs`
# (`runConcernDetector`) ПОВНІСТЮ заміняє policy-гілку, щойно концерн
# зʼявляється в `describe()`. Glob — РІВНО цільовий файл: він годує і
# detect-batch, і fix-batch (`build_full_scope_files`, §2.72).
key = "rust/vscode_extensions"
scope = "full"
glob = [".vscode/extensions.json"]

[capabilities]
# Хост передає вміст файлів inline у `detect-batch` (host-побудований
# full-scope batch для `rust/applies`/`rust/workspace_root`, per-file batch
# для `rust/doc_comments`) — плагін не читає диск сам (доккомент модуля
# `src/lib.rs`, розділ «Обхід дерева»).
fs_read = []
network = false
