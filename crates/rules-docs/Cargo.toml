[package]
name = "rules-docs"
version = "0.1.0"
edition = "2021"
description = "Семантичні гейти package knowledge: entailment-верифікатор evidence і expected↔implemented comparator — порт LLM-контуру docs build (клас 1 спеки ACP-only) на batch-фасад n7n-llm-lib"
license = "MIT"
publish = false

[dependencies]
llm-lib = { version = "0.5", package = "n7n-llm-lib" }
# Маркери зон згенерованого Markdown (`zones`) — строгий формат із
# необовʼязковими атрибутами; регулярка тут дзеркальна до JS-оригіналу, а
# ручний парсер розійшовся б із ним на першому ж крайньому випадку.
# Валідація knowledge-graph schema v1 (draft 2020-12). Схема живе поруч
# (`npm/rules/doc-files/package_knowledge/schema/`) і використовує лише
# консервативну підмножину ключових слів, але власний валідатор мовчки
# недоперевіряв би її після будь-якого розширення — тому повна реалізація.
jsonschema = "0.50"
# Обхід джерел домену з повагою до .gitignore (`sources`) — той самий крейт,
# на якому стоїть ripgrep. Семантика gitignore (порядок правил, заперечення,
# вкладені файли) надто тонка, щоб її відтворювати вручну: тут ціна власної
# реалізації — тихо інший набір файлів у документації.
# Розбір GraphQL-контрактів (`structured_sources`). Саме apollo-parser, а не
# `graphql-parser`/`async-graphql-parser`: ті розділяють SDL і операції
# окремими функціями, а канонічна фікстура — ЗМІШАНИЙ документ (`type` і
# `query` в одному файлі), який JS-`parse()` читає цілком.
apollo-parser = "0.8"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
# YAML-артефакти (OpenAPI/AsyncAPI можуть бути `.yaml`). Уже в графі через
# `rules-core` — приросту немає; `serde_yaml::Value` дає прямий еквівалент
# `doc.toJS()` пакета `yaml` без власного конвертера.
serde_yaml = "0.9"
# Маніфести доменів `Cargo.toml`/`pyproject.toml` (`domains`). Уже в графі
# через `rules-core` і `plugin-lang-js` — приросту немає.
toml = "0.8"
serde_json = "1"
# Хеш cache-ключів (`sha256:`-префіксований digest канонічного JSON) —
# дзеркальний до `deterministic.mjs`. Та сама мажорна лінія, що вже в графі
# через `n7n-trace`, тож жодного приросту артефакта.
sha2 = "0.11"
# `trace` — публічний тип у сигнатурі `llm_lib::batch::dispatch`
# (`Option<&mut trace::ChainHandle>`), тож консюмер мусить називати його сам:
# `n7n-llm-lib` цей крейт не реекспортує.
trace = { version = "0.1", package = "n7n-trace" }
# Лише `sync` — рівно `tokio::sync::Mutex` для `ChainRef` (Send-guard через
# `.await`, той самий мотив, що в `rules-adr`). Рантайм тягне викликач.
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
