[package]
name = "rules-docs"
version = "0.1.0"
edition = "2021"
description = "Семантичні гейти package knowledge: entailment-верифікатор evidence і expected↔implemented comparator — порт LLM-контуру docs build (клас 1 спеки ACP-only) на batch-фасад n7n-llm-lib"
license = "MIT"
publish = false

[dependencies]
llm-lib = { version = "0.4", package = "n7n-llm-lib" }
# Маркери зон згенерованого Markdown (`zones`) — строгий формат із
# необовʼязковими атрибутами; регулярка тут дзеркальна до JS-оригіналу, а
# ручний парсер розійшовся б із ним на першому ж крайньому випадку.
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Хеш cache-ключів (`sha256:`-префіксований digest канонічного JSON) —
# дзеркальний до `deterministic.mjs`. Та сама мажорна лінія, що вже в графі
# через `n7n-trace`, тож жодного приросту артефакта.
sha2 = "0.11"
# `trace` — публічний тип у сигнатурі `llm_lib::batch::dispatch`
# (`Option<&mut trace::ChainHandle>`), тож консюмер мусить називати його сам:
# `n7n-llm-lib` цей крейт не реекспортує.
trace = { version = "0.1", package = "n7n-trace" }
# Лише `sync` — рівно `tokio::sync::Mutex` для `ChainRef` (Send-guard через
# `.await`, той самий мотив, що в `rules-adr`). Рантайм тягне викликач.
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
