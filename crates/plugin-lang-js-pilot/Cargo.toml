[package]
name = "plugin-lang-js-pilot"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Пілотний wasm-компонент plugin contract v3 (n-rules:plugin@3.0.0) — один концерн vue/tfm-translations, порт main.mjs 1:1 (задача K фази 6, спека docs/specs/2026-07-31-plugin-contract-v3-wasm-component.md §3.5.2)"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60"
# Порт трьох regex-ів `main.mjs` (TFM_IMPORT_RE/TF_SPECIFIER_RE/GET_TR_DECL_RE)
# 1:1 — той самий синтаксис (жодного lookaround) прямо переноситься в
# regex-крейт; wasm32-wasip2 компілює його без додаткових features.
regex = "1"
