# Маніфест wasm-плагіна `ci-github/wasm-concerns` — П'ЯТИЙ first-party
# wasm-гість репозиторію (перший — `crates/plugin-lang-js`, другий —
# `crates/plugin-lang-python`, третій — `crates/plugin-lang-rust`, четвертий —
# `crates/plugin-lang-php`, доккомент того `plugin.toml` пояснює саму форму),
# створений за тим самим флоу скіла `npm/skills/wasm-plugin/`. ПЕРШИЙ
# НЕ-lang first-party гість: плагін-джерело — `@7n/rules-ci-github`
# (`plugins/ci-github/`), не `lang-*`. `id` тут — короткий package-суфікс
# (`ci-github`, той самий мотив, що `plugin-lang-js`'s `id =
# "lang-js/wasm-concerns"`, доккомент того `plugin.toml`: плагін НЕ
# відповідає 1:1 одному rule-namespace — `plugins/ci-github/rules/` уже несе
# `rust/`, `ga/`, `docker/`, `k8s/`, `npm-module/`, `security/`, `style/`,
# `text/`, `abie/`, `ci_artifact/`, і майбутні хвилі додаватимуть контрибуції
# з інших namespace-ів у ЦЕЙ САМИЙ крейт, не в `rust/wasm-concerns`).
#
# ДРУГА хвиля порту (перша — `rust/toolchain_cache`, лишається незмінною):
# `ga/workflows` (`plugins/ci-github/rules/ga/workflows/main.mjs`) — найбільший
# один концерн усієї міграції (п'ять зовнішніх tool-інтеграцій + 851 рядок
# Rego, доккомент `src/lib.rs`). `ci_artifact/consume` і решта `ga/*`
# sub-concern-ів (`clean_ga_workflows`/`clean_merged_branch`/`lint_ga`/
# `git_ai`/`workflow_common` МАЮТЬ ВЛАСНІ `.rego`-пакети, але то не окремі
# `ruleId/concernId` контрибуції JS-канону — вони вшиті РІВНО в `ga/workflows`
# як внутрішні rego-namespace-и, доккомент `src/lib.rs`) лишаються поза
# обсягом.
#
# ТРЕТЯ хвиля: три policy-концерни (`ga/vscode_extensions`,
# `ga/vscode_settings`, `security/lint_security_yml`) — доказ, що спільні
# JS T0-fix-рушії (`vscode-ext-add.mjs`/`template-deep-merge.mjs`)
# масштабуються на решту концернів цього плагіна без нової інфраструктури
# (доккомент `src/lib.rs`, розділ «ТРЕТЯ хвиля»). Поля 1:1 відповідають
# `rules_contract::manifest::Manifest`
# (crates/rules-contract/src/manifest.rs, без serde-перейменувань — назви
# полів тотожні Rust-структурі). Хост читає цей файл лише як довідник для
# людини й дистрибуційний supplement — джерело правди в рантаймі завжди
# `describe()` (не парситься назад у `PluginHost`, спека §3.1).

id = "ci-github/wasm-concerns"
version = "0.3.0"
world_version = "4.0.0"
domains = ["lint"]
# ТИМЧАСОВО порожньо: мажор `5.0.0` (§2.109 реєстру відкритих питань) додав
# поле `worlds`, реальна міграція шести гостей на декларації `caps`/
# `surfaces` — крок 4 спеки `docs/specs/2026-08-31-plugin-contract-v5.md`
# §12, окрема задача. До неї гість однаково НЕ інстанціюється на
# `5.x`-хості (`check_world_version` major-only).
worlds = []
# Top-level поля маніфеста — ОБОВʼЯЗКОВО перед першим `[[concerns]]`: після
# array-of-tables заголовка TOML відніс би їх до останнього елемента масиву,
# а не до кореня (та сама пастка, задокументована в `plugin.toml` решти
# чотирьох гостей).
ci_artifacts = []
# Чотири зовнішні тули, задекларовані РІВНО тим самим `manifest.tools`, що
# ЄДИНИЙ tool-consuming концерн цього крейта (`ga/workflows`) реально
# кличе через `exec-tool` — `rust/toolchain_cache` (перша хвиля) і далі не
# використовує жодного (`tools = []` було до цієї хвилі). Схема резолву на
# кожен — доккомент `src/lib.rs`, розділ «Чотири зовнішні тули»:
#   - `path:git` — `git ls-files` (`main.mjs:65`), системний тул, який
#     ensure-tool контур не керує (той самий мотив, що `path:cargo`/`path:uv`
#     у попередніх гостей).
#   - `npm:github-actionlint` — канон спавнить `bunx github-actionlint`
#     (`main.mjs:401`); порт резолвить БІН напряму через npm: схему
#     (`node_modules/.bin/github-actionlint`, фолбек PATH) — той самий бін,
#     що `bunx` зрештою запустив би, без bunx-обгортки (задокументована
#     недослівність — звіт задачі).
#   - `path:uvx` — канон спавнить `uvx zizmor …` (`main.mjs:404`), окремий
#     бінарник від `uv` (той самий мотив, що `path:bunx` окремо від
#     `path:bun` у `plugin-lang-js`).
#   - `shellcheck` — bare/managed схема (ensure-tool контур), той самий
#     мотив, що `mago` у `plugin-lang-php`: канон керує ним через
#     `ensureTool('shellcheck')`, не через голий `resolveCmd`.
tools = ["path:git", "npm:github-actionlint", "path:uvx", "shellcheck"]

[[concerns]]
# `concern.json` цього концерну декларує `lint.scope: "full"` БЕЗ
# `lint.anchors` (per-file делта тут не застосовна — детектор аналізує
# КОЖЕН workflow-файл цілком, крос-job) — glob контрибуції тут ширший за
# `concern.json.lint.glob` (лише `.github/workflows/*.{yml,yaml}`): host
# full-scope батч будується РІВНО з цього поля (доккомент `src/lib.rs`), і
# детектору так само потрібні `Cargo.toml`/`src-tauri/Cargo.toml` для
# `tauriWorkspaceDir` (`main.mjs`) — той самий свідомий вибір розширення
# glob-у понад `concern.json`, що `php/tooling`
# (`crates/plugin-lang-php/plugin.toml`).
key = "rust/toolchain_cache"
scope = "full"
glob = [
  ".github/workflows/*.yml",
  ".github/workflows/*.yaml",
  "Cargo.toml",
  "src-tauri/Cargo.toml"
]

[[concerns]]
# `ga/workflows` — full-scope, БЕЗ `lint.anchors` (`concern.json` не має
# жодного, і per-file делта тут не застосовна: `lint()` канону читає ВЕСЬ
# каталог `.github/workflows/` разом, крос-файл — `workflow_common`-rego
# батчить усі `.yml` одразу, `checkGaWorkflowFiles` рахує required-set
# по ВСІХ файлах). `glob` тут НАБАГАТО ширший за `concern.json.lint.glob`
# (лише `.github/workflows/**`) — доккомент `src/lib.rs`, розділ «Glob
# контрибуції понад concern.json»: покриває все, що `lint()` читає з диска.
key = "ga/workflows"
scope = "full"
glob = [
  ".github/workflows/*",
  ".github/actions/setup-bun-deps/action.yml",
  ".mega-linter.yml",
  ".megalinter.yaml",
  ".mega-linter.yaml"
]

[[concerns]]
# ТРЕТЯ хвиля — `ga/vscode_extensions`: full-scope, ОДИН target-файл
# (`concern.json.policy.files.single`), той самий glob (доккомент
# `src/lib.rs`, розділ «ТРЕТЯ хвиля»).
key = "ga/vscode_extensions"
scope = "full"
glob = [".vscode/extensions.json"]

[[concerns]]
# ТРЕТЯ хвиля — `ga/vscode_settings`: full-scope, ОДИН target-файл.
key = "ga/vscode_settings"
scope = "full"
glob = [".vscode/settings.json"]

[[concerns]]
# ТРЕТЯ хвиля — `security/lint_security_yml`: full-scope, ОДИН target-файл.
key = "security/lint_security_yml"
scope = "full"
glob = [".github/workflows/lint-security.yml"]

# ЧЕТВЕРТА хвиля — дванадцять `createTemplateFixPattern`-концернів, кожен
# full-scope з ОДНИМ target-файлом (той самий мотив, що ТРЕТЯ хвиля вище,
# доккомент `src/lib.rs`, розділ «ЧЕТВЕРТА хвиля»). Дев'ять мають власний
# `.rego` (детект через regorus, `detect_policy`); два (`ga/lint_repo_yml`,
# `npm-module/npm_publish_yml`) — `"check": "template"` у `concern.json`
# (НЕМАЄ `.rego`, детект — структурний subset, `detect_template_check`).

[[concerns]]
key = "ga/git_ai"
scope = "full"
glob = [".github/workflows/git-ai.yml"]

[[concerns]]
key = "ga/lint_ga"
scope = "full"
glob = [".github/workflows/lint-ga.yml"]

[[concerns]]
key = "ga/clean_ga_workflows"
scope = "full"
glob = [".github/workflows/clean-ga-workflows.yml"]

[[concerns]]
key = "ga/clean_merged_branch"
scope = "full"
glob = [".github/workflows/clean-merged-branch.yml"]

[[concerns]]
key = "docker/lint_docker_yml"
scope = "full"
glob = [".github/workflows/lint-docker.yml"]

[[concerns]]
key = "ga/zizmor_yml"
scope = "full"
glob = [".github/zizmor.yml"]

[[concerns]]
key = "k8s/lint_k8s_yml"
scope = "full"
glob = [".github/workflows/lint-k8s.yml"]

[[concerns]]
key = "style/lint_style_yml"
scope = "full"
glob = [".github/workflows/lint-style.yml"]

[[concerns]]
key = "text/lint_text"
scope = "full"
glob = [".github/workflows/lint-text.yml"]

[[concerns]]
# `required: false` (`concern.json` немає `policy.files.required`) —
# доккомент `src/lib.rs`, [`PolicyCfg::required`]: спільний target-файл з
# `ga/clean_merged_branch` вище, той самий glob навмисно.
key = "abie/clean_merged_ignore_branches"
scope = "full"
glob = [".github/workflows/clean-merged-branch.yml"]

[[concerns]]
key = "ga/lint_repo_yml"
scope = "full"
glob = [".github/workflows/lint-repo.yml"]

[[concerns]]
key = "npm-module/npm_publish_yml"
scope = "full"
glob = [".github/workflows/npm-publish.yml"]

[[concerns]]
# ПʼЯТА хвиля — ПЕРШИЙ walkGlob-концерн цього гостя з ОКРЕМИМ
# `ruleId/concernId`-ключем (набір `.github/workflows/*.yml`, не один
# таргет) і ПЕРША `per-file`-контрибуція. Портовано ЛИШЕ detect: T0-фікс
# (`fix-service_deploy_workflow.mjs`) потребує реєстру ввімкнених правил
# (`relevantDomains` → `loadEnabledLintRules`), якого гість не має жодним
# каналом контракту — доккомент `src/lib.rs`, розділ «ПʼЯТА хвиля».
key = "ga/service_deploy_workflow"
scope = "per-file"
glob = [".github/workflows/*.yml"]

[capabilities]
# Хост передає вміст файлів inline у `detect-batch` (host-побудований
# full-scope batch за `glob` вище) — плагін не читає диск сам (той самий
# мотив, що решта чотирьох гостей). `git ls-files`/actionlint/zizmor/
# shellcheck отримують РЕАЛЬНИЙ доступ до диска не через WASI fs_read, а
# через `exec-tool` (спавнений процес виконується з правами хоста, ПОЗА
# wasm-пісочницею, доккомент `wit/world.wit::tool-result` — trust boundary
# тула, не пісочниці).
fs_read = []
network = false
