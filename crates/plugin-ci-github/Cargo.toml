[package]
name = "plugin-ci-github"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "wasm-компонент n-rules:plugin@3.2.0 — ci-github/wasm-concerns (5 концернів: rust/toolchain_cache, ga/workflows, ga/vscode_extensions, ga/vscode_settings, security/lint_security_yml)"

[lib]
# `cdylib` — обов'язково: `wasm32-wasip2` виводить готовий Component Model
# компонент лише з цього crate-type (той самий мотив, що
# `crates/plugin-lang-js`/`crates/plugin-lang-python`/`crates/plugin-lang-rust`/
# `crates/plugin-lang-php`, доккомент тих Cargo.toml).
crate-type = ["cdylib"]

[dependencies]
# Пін звірено з рештою чотирьох гостей (той самий мінор, що резолвиться в
# Cargo.lock кореня) — НЕ розширюй у caret-діапазон без причини.
wit-bindgen = "0.60"
# `ga/workflows` (друга хвиля порту `plugins/ci-github/rules/ga/workflows/main.mjs`)
# оцінює 851 рядок Rego через `regorus` (Microsoft, MIT AND Apache-2.0 AND
# BSD-3-Clause, github.com/microsoft/regorus) — жодного `conftest`-субпроцесу.
#
# **ОНОВЛЕНО** (реєстр відкритих питань
# `docs/plans/2026-08-05-open-questions-register.md` §2.66): `regorus`
# ПЕРЕЇХАВ із цього гостя на хост — `wasm32-wasip2`-збірка більше НЕ несе
# `regorus`/`regex` у своєму component-графі взагалі (Cargo резолвить
# залежності по цільовій платформі — таргет-специфічний блок нижче ставить
# `rules-rego-engine` лише на `cfg(not(target_arch = "wasm32"))`, wasm32
# кличе host-import resource `rego-engine`, `wit/world.wit`). Стара пряма
# `regorus`-залежність цього крейта (0,11, `["regex","std"]`) видалена
# ЦІЛКОМ — попередні заміри розміру («regorus з default-features —
# 6 223 519 байт компонента; тримана конфігурація `regex`+`std` — 2 578 673»)
# лишаються документованою історією вибору фітів, перенесеною дослівно в
# `crates/rules-rego-engine/Cargo.toml` (той самий пін, той самий
# feature-набір — семантика НЕ переглядалась, лише хост, що її виконує,
# змінився). Нове виміряне число розміру ЦЬОГО гостя (до/після) — звіт
# задачі §2.66, не тут.
#
# YAML — `saphyr` (YAML 1.2, а не Go-yaml 1.1, яким читає `conftest`;
# найменший виміряний, активно підтримуваний, НЕ deprecated). regorus має
# власний `yaml`-фіт, але той на опублікованому 0.11.0 тягне
# `serde_yaml v0.9.34+deprecated` — свідомо уникнено. Плагін парсить
# workflow-YAML САМ (вхідний `input` для кожного Rego-виклику) і
# конвертує AST у JSON-текст ([`yaml_to_json`], `src/lib.rs`) — жодного
# YAML-крейта в regorus-фітах, лише тут (і regorus тепер не тут, доккомент
# вище).
saphyr = "0.0"
# `\b`-межа слова для `BARE_N_RULES`-перевірки ([`verify_no_bare_n_cursor`]/
# `fix_workflows`) — ПРЯМИЙ вжиток цим крейтом, НЕ лише sibling-feature-unify
# трюк для регорус-а (той трюк відпав разом із регорус-ом, доккомент вище):
# `\b`-assertion не має character-class еквівалента, ручний порт без regex
# сюди не підходить (на відміну від чотирьох `uses:`-патернів
# [`line_has_uses_target`]/[`is_workspaces_key`] нижче — ті свідомо без
# regex). Лишається УНІВЕРСАЛЬНОЮ (не таргет-гейтованою) залежністю — ці
# виклики живуть і на wasm32 (продакшн), і на host-таргеті (тести).
regex = { version = "1", features = ["unicode-perl"] }
# `jsonc-parser` (dprint, MIT, 9,66 млн завантажень) — справжня JSONC-підтримка
# (`//`/`/* */`-коментарі, trailing comma) для `.vscode/*.json`-таргетів
# ([`fix_template_merge`]/[`fix_vscode_extensions`]/[`detect_policy`]),
# заміна floor-валідатора `is_strict_json` (звіт задачі §2.58, друга
# поправка — «target 2 лишається нереалізованою метою» — ЦЯ задача її
# реалізує). Усі залежності `jsonc-parser` у ЙОГО ВЛАСНОМУ `Cargo.toml`
# позначені `optional` (`indexmap`/`rustc-hash`/`serde`/`serde_json`/
# `unicode-width` — усі за фітами `preserve_order`/`fast_hash`/`serde`/
# `serde_json`/`error_unicode_width`) — без явних фітів тут (порожній
# `features = []`, дефолт) крейт БЕЗдепний, той самий мотив «вага не
# виправдана для вузького вжитку», яким репо раніше мотивувало відмову від
# `serde_json` (доккомент `Cargo.toml` `lang-php`/`lang-python`), тут більше
# НЕ застосовний — саме тому вибір впав на `jsonc-parser`, не на
# `serde_json` (транзитивний через `regorus`, але не публічно
# ре-експортований). `parse_to_ast` дає AST із байтовими `Range` на кожному
# вузлі (не лише `parse_to_value`, який коментарі відкидає) —
# коментарі НЕ входять у діапазон жодного вузла (окрема `CommentMap`,
# `CommentCollectionStrategy::Off` за замовчуванням — комент-collection тут
# НЕ вмикається взагалі, нам потрібні лише діапазони «живих» вузлів, той
# самий «trivia» контракт, що вже дає block-стиль YAML/[`saphyr`] для
# сусідніх YAML-коментарів), тож той самий [`MNode`]-обхід і [`Edit`]-машинерія
# (доккомент розділу «Хірургічний comment-preserving merge») перевикористані
# буквально — коментарі виживають СТРУКТУРНО (недоторкані діапазони поза
# вузлами), не спеціальним кодом, який їх шукає.
jsonc-parser = { version = "0.33", default-features = false }
# НАВМИСНО жодної іншої залежності — той самий мотив, що
# `crates/plugin-lang-php` (найлегший з чотирьох попередніх гостей): ЄДИНИЙ
# портований концерн (`rust/toolchain_cache`) не потребує YAML-парсера
# (доккомент модуля `main.mjs`, розділ «текстовий, не YAML-AST аналіз» —
# навмисне рішення JS-канону, збережене тут) і жоден із чотирьох його
# регулярних виразів (`TOOLCHAIN_RE`/`CACHE_RE`/`TAURI_ACTION_RE`/
# `WORKSPACES_KEY_RE`) не потребує lookaround/backreference чи навіть
# `\w`/`\d` — усі чотири зводяться до пошуку літерального підрядка ПІСЛЯ
# `uses:` (з опційним пробілом між ними) чи на початку рядка (`workspaces:`),
# портовано вручну без regex-крейта (`src/lib.rs::line_has_uses_target`/
# `is_workspaces_key`), той самий мотив, що `extract_php_version` у
# `crates/plugin-lang-php` (ручний порт замість тягнути regex заради двох
# простих патернів). `rust/toolchain_cache` (перша хвиля) лишається
# найлегшим ОКРЕМИМ концерном цього крейта; `ga/workflows` (друга хвиля,
# цей блок) додає saphyr — регорус (§2.66) більше не тут (доккомент вище).

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Реєстр §2.66: `regorus` виконується IN-PROCESS лише на host-таргеті
# (нативні `cargo test`) — той самий `rules-rego-engine`, що
# `crates/rules-plugin-host` реалізує через host-import resource
# `rego-engine` для wasm32 (доккомент [`RegoEngineHandle`], `src/lib.rs`).
# Cargo резолвить цю залежність ЛИШЕ на не-wasm32 таргеті — у
# wasm32-wasip2 build graph цього ребра просто немає, тож `regorus`/`regex`
# НЕ резолвиться в component-артефакт узагалі.
rules-rego-engine = { path = "../rules-rego-engine" }

[dev-dependencies]
# Anti-drift тест `plugin_toml_concern_keys_match_describe` (той самий мотив,
# що решта чотирьох гостей) — парсить `plugin.toml` СПРАВЖНІМ TOML-парсером.
# Dev-only: у wasm32-wasip2 cdylib не потрапляє.
toml = "0.8"
