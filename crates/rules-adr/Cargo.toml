[package]
name = "rules-adr"
version = "0.1.0"
edition = "2021"
description = "Локальний ADR-нормалізатор: порт конвеєра normalize-pipeline.mjs (клас 1 спеки ACP-only) — JS оркеструє померло, Rust оркеструє; LLM-ходи через batch-фасад n7n-llm-lib"
license = "MIT"
publish = false

[dependencies]
llm-lib = { version = "0.3", package = "n7n-llm-lib" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
