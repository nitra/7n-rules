[package]
name = "plugin-lang-python"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "wasm-компонент n-rules:plugin@4.0.0 — python/wasm-concerns (3 контрибуції першої хвилі: python/applies, python/tooling, python/doc_comments)"

[lib]
# `cdylib` — обов'язково: `wasm32-wasip2` виводить готовий Component Model
# компонент лише з цього crate-type (той самий мотив, що
# `crates/plugin-lang-js`, доккомент того `Cargo.toml`).
crate-type = ["cdylib"]

[dependencies]
# Пін звірено з `crates/plugin-lang-js/Cargo.toml` (той самий мінор, що
# резолвиться в Cargo.lock кореня) — НЕ розширюй у caret-діапазон без причини.
wit-bindgen = "0.60"
# Порт regex-ів `python/doc_comments` (PUBLIC_DEF_RE/DOCSTRING_START_RE/
# COMMENT_LINE_RE/HEADER_SKIP_RE/FUTURE_IMPORT_RE) і `EXCLUDED_FILE_RE`
# (`plugins/lang-python/rules/python/doc_comments/main.mjs`) 1:1 — жодного
# lookaround, прямий перенос у regex-крейт.
#
# `default-features = false` + явний список, той самий скорочений набір, що
# `crates/plugin-lang-js/Cargo.toml` мінус `unicode-case`: "unicode-perl"
# ОБОВ'ЯЗКОВИЙ (не опційна оптимізація — спроба зібрати без нього дає
# regex-parse-error `Unicode-aware Perl class not found`, перевірено
# емпірично, а не здогад із доккомента сусіднього крейта): `\w`/`\s` у
# `PUBLIC_DEF_RE` компілюються лише за наявності цієї фічі. "unicode-case"
# НЕ потрібен — жоден з патернів цього крейта не має `(?i)`.
regex = { version = "1", default-features = false, features = [
  "std",
  "perf",
  "unicode-perl",
] }
# `python/workspace_root` парсить `pyproject.toml` (наявність `[project]`,
# `[tool.uv.workspace].members`/`.exclude`). Емпірично зважено (release
# wasm32-wasip2, той самий build.sh) проти `toml = "0.8"` (уже dev-dependency
# нижче, той самий пін, що `rules-core`/`rules-docs`): ідентичний probe-виклик
# (typed struct, `#[serde(default)]`, без `Value`/`Table`) додав ДО бінарника
# ~183 KiB через `basic-toml`, ~286 KiB через `toml` — різниця ~106 KiB
# (`toml` тягне `toml_edit` → `winnow` + `indexmap`, `basic-toml` — лише
# `serde`, жодного style-preserving edit-шару, якого тут узагалі не треба:
# лише читання кількох полів, без запису назад). За бюджету гостя 2,5 MiB
# (зайнято ~1,03 MiB до цього концерну, спільний з ще двома паралельними
# концернами хвилі) легший крейт — свідомий вибір, не дефолт "бо вже є в
# lockfile".
basic-toml = "0.1"
# `serde` з `derive` — типізовані struct-и `PyProjectToml`/`UvWorkspace`
# (`main.rs`) замість generic `Value`/`Table` (`basic-toml` жодного не дає,
# доккомент вище): дерево з `#[serde(default)]` на кожному опційному полі
# ігнорує всі невідомі ключі маніфеста без падіння (той самий tolerant-парсинг
# дух, що `smol-toml`-виклик JS-оригіналу — `parseToml` без схеми). `derive`
# macro не потрапляє в сам `.wasm` (proc-macro виконується під час компіляції
# host-у, не лінкується) — вартість лише рантайм-крейт `serde`, вже
# врахований у probe-вимірі вище (той самий виклик мав і `#[derive]`-структури).
serde = { version = "1", default-features = false, features = ["derive"] }

# Двигун JSONC-парсу/серіалізації (`Json`/`parse_jsonc_document`/
# `json_to_pretty_string`/`json_to_string`) для концерну
# `python/vscode_extensions` — спільний крейт `rules-template-merge` (§2.71):
# одна семантика на нативну колію (`crates/rules-core`) і на гостей, бо
# родина `vscode_*` розсипана між ядром і плагінами й дві копії розійшлися б
# ТИХО. Фіча `yaml` НЕ вмикається (дефолт `jsonc`) — цільовий файл цього
# концерну лише `.vscode/extensions.json`, `saphyr` у граф не входить.
rules-template-merge = { path = "../rules-template-merge" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# §2.66: `regorus` виконується IN-PROCESS лише на host-таргеті (нативні
# `cargo test` цього крейта) — той самий `rules-rego-engine`, що
# `crates/rules-plugin-host` реалізує через host-import resource
# `rego-engine` для wasm32 (доккомент `RegoEngineHandle`, `src/lib.rs`).
# Cargo резолвить цю залежність ЛИШЕ на не-wasm32 таргеті — у
# wasm32-wasip2 build graph цього ребра немає, тож у size-бюджет гостя
# `regorus` не важить нічого.
rules-rego-engine = { path = "../rules-rego-engine" }

[dev-dependencies]
# Anti-drift тест `plugin_toml_concern_keys_match_describe` (той самий
# мотив, що `crates/plugin-lang-js/Cargo.toml`) — парсить `plugin.toml`
# СПРАВЖНІМ TOML-парсером. Dev-only: у wasm32-wasip2 cdylib не потрапляє.
toml = "0.8"
