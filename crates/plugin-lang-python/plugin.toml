# Маніфест wasm-плагіна `python/wasm-concerns` — ДРУГИЙ first-party wasm-гість
# репозиторію (перший — `crates/plugin-lang-js`, доккомент того `plugin.toml`
# пояснює саму форму). Перша хвиля порту: три концерни без зовнішніх тулів і
# без обходу файлової системи гостем (доккомент модуля `src/lib.rs`)
# — статичний дублікат того, що `describe()` (src/lib.rs) повертає в рантаймі.
# Поля 1:1 відповідають `rules_contract::manifest::Manifest`
# (crates/rules-contract/src/manifest.rs, без serde-перейменувань — назви
# полів тотожні Rust-структурі). Хост читає цей файл лише як довідник для
# людини й дистрибуційний supplement — джерело правди в рантаймі завжди
# `describe()` (не парситься назад у `PluginHost`, спека §3.1).

id = "python/wasm-concerns"
version = "0.1.0"
world_version = "4.0.0"
domains = ["lint"]
# Top-level поля маніфеста — ОБОВʼЯЗКОВО перед першим `[[concerns]]`: після
# array-of-tables заголовка TOML відніс би їх до останнього елемента масиву,
# а не до кореня (доккомент `crates/plugin-lang-js/plugin.toml` пояснює той
# самий клас дрейфу, спійманий anti-drift тестом `plugin_toml_concern_keys_match_describe`).
ci_artifacts = []
# `python/mypy`+`python/ruff` (друга хвиля) — перші споживачі `run-tool`/
# `exec-tool` цього плагіна, обидва йдуть через `uv run --frozen`, тож ОДНА
# декларація на двох (доккомент `src/lib.rs` перед `build_manifest`).
tools = ["path:uv"]

[[concerns]]
key = "python/applies"
scope = "full"
glob = ["pyproject.toml"]

[[concerns]]
key = "python/tooling"
scope = "full"
glob = [
  "pyproject.toml",
  "uv.lock",
  "poetry.lock",
  "poetry.toml",
  "package.json",
  ".github/workflows/lint-python.yml",
]

[[concerns]]
key = "python/doc_comments"
scope = "per-file"
glob = ["**/*.py"]

[[concerns]]
# `pyproject.toml` до DELTA-batch-у приносить `lint.anchors` відповідного
# `concern.json` (JS-планувальник, plan_concern_for_delta), НЕ цей glob —
# доккомент `src/lib.rs` перед `build_manifest`, розділ «Per-file + якорі».
# У FULL-прогоні (`--full`) якорів немає — batch будує хост рівно з цього
# glob-а (`crates/rules-napi::build_detect_batch_files`, §2.65), тож
# `pyproject.toml` тут ЯВНО: без нього `prepare_python_run` мовчки
# повертав би `Skip` на кожному full-прогоні.
key = "python/mypy"
scope = "per-file"
glob = ["**/*.py", "pyproject.toml"]

[[concerns]]
key = "python/ruff"
scope = "per-file"
glob = ["**/*.py", "pyproject.toml"]

[[concerns]]
# Друга хвиля (доккомент `src/lib.rs`) — єдиний концерн крейта, що бачить
# УСЕ дерево репозиторію (host-batch за цим глобом + власний
# `IGNORED_DIR_NAMES`-фільтр гостя,
# `crates/plugin-lang-python/src/lib.rs::detect_workspace_root`).
key = "python/workspace_root"
scope = "full"
glob = ["**/pyproject.toml", "**/uv.lock"]

# Друга хвиля порту: read-only lockfile-аудит `uv` + ліцензійна перевірка
# Blue Oak Council (доккомент `src/lib.rs`, секція `python/project`). Глоб
# звужений до ОДНОГО файлу — той самий мотив, що `bun/licensee`
# (`crates/plugin-lang-js/plugin.toml`): решту вердикту дає ланцюжок
# `exec-tool`, не читання диска гостем.
[[concerns]]
key = "python/project"
scope = "full"
glob = ["pyproject.toml"]

[[concerns]]
# Policy-концерн (`plugins/lang-python/rules/python/vscode_extensions/vscode_extensions.rego` + `template/extensions.json.snippet.json`, без
# `main.mjs`) — портовані ОБИДВІ половини, детект і фікс: `detect.mjs`
# (`runConcernDetector`) ПОВНІСТЮ заміняє policy-гілку, щойно концерн
# зʼявляється в `describe()`. Glob — РІВНО цільовий файл: він годує і
# detect-batch, і fix-batch (`build_full_scope_files`, §2.72).
key = "python/vscode_extensions"
scope = "full"
glob = [".vscode/extensions.json"]

[capabilities]
# Хост передає вміст файлів inline у `detect-batch` (host-побудований
# full-scope batch для `python/applies`/`python/tooling`, per-file batch для
# `python/doc_comments`) — плагін не читає диск сам (доккомент модуля
# `src/lib.rs`, розділ «Обхід дерева»).
fs_read = []
network = false
