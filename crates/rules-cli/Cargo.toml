# cspell:ignore чинного міжпроцесного gethostname
[package]
name = "rules-cli"
version = "0.1.0"
edition = "2021"
description = "Rust CLI @7n/rules (фаза 8 — інверсія entrypoint): native-команди поверх rules-core + транзитна делегація решти у чинний JS-entrypoint"
license = "Apache-2.0"

[[bin]]
name = "rules-cli"
path = "src/main.rs"

[dependencies]
rules-core = { path = "../rules-core" }
# Єдина граматика argv усіх native-команд (`src/cli.rs`, рішення Р11 спеки
# міграції: зрілий крейт виграє в ручного порту). Урізаний набір фіч свідомо:
# `color` не беремо — вивід CLI гейтиться byte-exact parity-тестами, ANSI там
# зайвий; `suggestions` («did you mean») — англомовний рядок у продукті, чия
# мова українська, а помилки розбору рендерить `describe_parse_error`.
clap = { version = "4", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
] }
# JSON-парсинг у native-командах (`bridge`, `adr_cmd`, `hook_cmd`,
# `tools_cmd`, `js_fallback`, `lint_cmd`, `tool_lock`, `cursor_ignore`).
# `git_policy.rs` сам більше НЕ парсить JSON напряму — повний `readGitPolicy`
# переїхав у `rules_core::git_policy` (доккомент `src/git_policy.rs`), цей
# крейт лишає лише тонку обгортку над ним.
serde_json = "1"
# Серіалізація `owner.json` міжпроцесного лока (`tool_lock`) у форматі, який
# читає JS-бік того самого лока (`with-lock.mjs`).
serde = { version = "1", features = ["derive"] }
# `gethostname`/`kill(pid, 0)` для лока (`tool_lock`) — точні відповідники
# `os.hostname()` і `process.kill(pid, 0)` JS-версії. Крейт уже транзитивно в
# графі збірки (`gix`, `tempfile`), пряма залежність нового крейта не додає.
libc = "0.2"
# Native-контур фіксу (`--native-fix`, `src/fix_cmd.rs`): склейка циклу `fix`
# з lint-доменом. Важкий async/rig-стек входить саме сюди — у бінар, який
# фікс і виконує, а не в `rules-core`, що навмисно лишається легким
# (рішення Р9; див. §3.1 спеки `2026-08-08-llm-lib-acp-only-rust-goose.md`).
rules-fix = { path = "../rules-fix" }
rules-adr = { path = "../rules-adr" }
harness = { version = "0.3", package = "n7n-harness" }
llm-lib = { version = "0.5", package = "n7n-llm-lib" }
# Рантайм заводиться лише під `--native-fix` (`fix_cmd::run_blocking`) —
# решта native-команд CLI повністю синхронна.
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
