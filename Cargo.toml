[workspace]
resolver = "2"
members = [
  "llm-lib/crates/llm-lib",
  "llm-lib/crates/llm-lib-napi",
  "crates/rules-core",
  "crates/rules-fix",
  "crates/rules-napi",
  "crates/rules-cli",
  "crates/rules-contract",
  "crates/rules-plugin-host",
  "crates/test-plugin-guest",
  "crates/plugin-lang-js",
]
# `crates/test-plugin-guest` — guest-фікстура contract-test-kit
# `crates/rules-plugin-host` (задача I2, спека
# `docs/specs/2026-07-31-plugin-contract-v3-wasm-component.md`).
# `crates/plugin-lang-js` — РЕАЛЬНИЙ wasm-плагін lang-js (задача N2, та сама
# спека, §3.5.5), створений скілом `npm/skills/wasm-plugin/`: два концерни,
# `vue/tfm-translations` (per-file) і `style/gap` (full-scope), порт чинних
# `plugins/lang-js/rules/vue/tfm-translations/main.mjs` і
# `plugins/lang-js/rules/style/gap/main.mjs` 1:1. Замінює пілотний
# `crates/plugin-lang-js-pilot` (виведений задачею N2 — довів конвеєр, більше
# не потрібен окремо від реального плагіна). Той самий workspace-мотив нижче
# стосується й цього крейта.
#
# Свідомо ЗВИЧАЙНИЙ `members`-запис, не `workspace.exclude` + власний
# `[workspace]` у крейті (як типово роблять для wasm-guest-фікстур в інших
# монорепо): цей репозиторій — вкладений git worktree
# (`.claude/worktrees/<...>/` живе ПІД основним чекаутом того самого репо,
# в якого теж є кореневий `Cargo.toml` із `[workspace]`). Для не-члена
# `crates/test-plugin-guest` реальна поведінка Cargo (перевірено емпірично):
# автопошук workspace root підіймається повз найближчий предок з
# `exclude`-записом до ДРУГОГО, зовнішнього workspace (кореня основного
# чекауту) і падає `error: current package believes it's in a workspace
# when it's not` — `exclude` сам собою НЕ робить пакет самостійним
# workspace root, попри те, що офіційне повідомлення Cargo про це натякає
# (працює лише коли пакет своєю `[workspace]`-таблицею явно скасовує
# пошук — що заборонено `rust/workspace_root`
# (`plugins/lang-rust/rules/rust/workspace_root/workspace_root.mdc`), або
# коли ВИЩЕ по дереву взагалі немає іншого workspace — не наш випадок через
# вкладеність worktree). Членство в кореневому workspace — єдиний спосіб
# задовольнити І Cargo (немає конфлікту резолву), І лінт (один кореневий
# workspace, без вкладених `[workspace]`/`[profile.*]`).
#
# Практичний ризик такого членства — конфлікт build-графів
# (`crates/test-plugin-guest` компілюється під `wasm32-wasip2`, wit-bindgen
# генерує host-специфічні `extern "C"` glue) — емпірично не підтвердився:
# `wit-bindgen`-згенерований код гейтить wasm-специфічну ABI-обв'язку за
# `cfg(target_arch = "wasm32")`, тож `cargo build`/`cargo test --workspace`
# без `--target` компілюють і "пропускають" цей крейт на host-таргеті без
# помилок лінкування (перевірено: `cargo build -p test-plugin-guest`,
# `cargo test --workspace` — обидва проходять на aarch64-apple-darwin).

# Per-package size-оптимізація `plugin-lang-js` (задача Q3, спека
# `docs/specs/2026-08-01-wasm-ast-strategy.md`, розділ «Рішення» п.2 —
# size-budget 2.5 MB на компонент, спайк S1 показав oxc_parser сам собою
# додає 549 KB–869 KB залежно від профілю). `rust/workspace_root`
# (`plugins/lang-rust/rules/rust/workspace_root/workspace_root.mdc`) забороняє
# БУДЬ-ЯКИЙ `[profile.*]` у не-кореневому `Cargo.toml` — єдиний дозволений
# механізм тут: per-package override у КОРЕНЕВОМУ `[profile.release]`
# (ЦЕЙ блок нижче — НЕ сам `[profile.release]`, який свідомо лишається
# відсутнім/дефолтним для решти workspace, задача явно забороняла його
# чіпати). Cargo НЕ дозволяє per-package override для `lto`/`panic`/`rpath`
# (лише для профілю в цілому) — тож агресивна комбінація зі спайка
# (opt-level="z"+lto+strip+panic=abort+codegen-units=1, 549 KB) тут
# недосяжна повністю; підмножина, доступна per-package
# (`opt-level`/`codegen-units`/`strip`), застосована нижче — виміряний
# результат задокументовано в `crates/plugin-lang-js/src/lib.rs` (доккомент
# модуля, розділ AST-концернів) і у звіті задачі Q3.
#
# Задача size-budget (2026-08-05) виміряла решту профільних важелів на
# реальному компоненті (2 492 361 байт до зрізу), щоб наступний, хто впреться
# в стелю, не переміряв те саме:
# - `panic = "abort"` — **нульовий** ефект: `wasm32-wasip2` і так має
#   `panic-strategy: abort` у target-специфікації, збірка з примусовим
#   `-C panic=abort` у прапорцях rustc дала БАЙТ-У-БАЙТ той самий артефакт.
#   Рядок зі спайкової комбінації, який нічого не дає саме тут;
# - `lto = "thin"` — −95 541 байт (−3,8 %), `lto = "fat"` — −269 655 байт
#   (−10,8 %). Обидва вимагають `[profile.release]` НА ВЕСЬ workspace (Cargo
#   не бере `lto` в per-package override, див. абзац вище) — тобто fat-LTO для
#   `llm-lib`, `rules-napi` і `rules-cli` теж, із відповідним часом release-
#   збірок у CI. Свідомо НЕ вмикаємо: потрібний запас уже дав зріз невживаних
#   feature-ів залежностей (`crates/plugin-lang-js/Cargo.toml`, доккоменти
#   `regex` і `oxc_parser`) — це резерв на потім із відомою ціною.
[profile.release.package."plugin-lang-js"]
opt-level = "z"
codegen-units = 1
strip = true
